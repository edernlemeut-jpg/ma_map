<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carte Galactique - Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ... styles existants ... */
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none; 
        }
        
        #map-grid {
            width: 1600px;
            height: 1600px;
            display: grid;
            grid-template-columns: repeat(40, 40px);
            grid-template-rows: repeat(40, 40px);
            background-color: #111827; /* bg-gray-900 (couleur de fond de repli) */
            
            /* Image de fond alignée sous la grille */
            background-image: url('carte_interactive_ma.png');
            background-size: 1600px 1600px; /* Force la taille pour l'alignement */
            background-repeat: no-repeat;
            background-position: center;
            
            transform-origin: 0 0;
            will-change: transform; 
        }

        .quadrant {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(107, 114, 128, 0.2); /* border-gray-400/20 */
            box-sizing: border-box;
            position: relative;
        }
        
        .quadrant.has-system::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background-color: #38bdf8; /* sky-400 */
            border-radius: 50%;
            opacity: 0.6;
        }
        
        .quadrant.path-point { background-color: rgba(250, 204, 21, 0.3); } /* amber-300 */
        .quadrant.start-point { background-color: rgba(74, 222, 128, 0.5); } /* green-400 */
        .quadrant.end-point { background-color: rgba(248, 113, 113, 0.5); } /* red-400 */
        .quadrant.etape-point { background-color: rgba(250, 204, 21, 0.5); } /* amber-300 */
        
        /* Style pour le quadrant sélectionné */
        .quadrant.selected {
            outline: 2px solid #fde047; /* yellow-300 */
            background-color: rgba(253, 224, 71, 0.15);
            z-index: 10;
        }
        
        .modal-open {
            overflow: hidden;
        }

        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }
        #modal-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1f2937; /* bg-gray-800 */
            color: #f3f4f6; /* text-gray-100 */
            border-top-left-radius: 1rem; /* rounded-t-xl */
            border-top-right-radius: 1rem;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            will-change: transform;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        .modal-handle {
            width: 40px;
            height: 4px;
            background-color: #4b5563; /* bg-gray-600 */
            border-radius: 2px;
            margin: 0.5rem auto;
            flex-shrink: 0;
        }
        
        .modal-header {
            padding: 0 1rem 0.5rem 1rem;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .modal-header h2 {
            text-align: center;
            flex-grow: 1;
        }
        
        .modal-close-btn {
            position: absolute;
            right: 0.5rem;
            top: -0.25rem;
            padding: 0.5rem;
            border-radius: 99px;
            background-color: #374151; /* bg-gray-700 */
        }
        
        /* Bouton réduire */
        .modal-minimize-btn {
            position: absolute;
            left: 0.5rem;
            top: -0.25rem;
            padding: 0.5rem;
            border-radius: 99px;
            background-color: #374151; /* bg-gray-700 */
            color: #9ca3af;
        }
        .modal-minimize-btn:hover {
            color: #fff;
            background-color: #4b5563;
        }

        .modal-content {
            padding: 0 1rem 1rem 1rem;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .edit-page-header {
            background-color: #1f2937; /* bg-gray-800 */
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #374151; /* border-gray-700 */
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.875rem; /* text-sm */
            font-weight: 500;
            color: #9ca3af; /* text-gray-400 */
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background-color: #374151; /* bg-gray-700 */
            border: 1px solid #4b5563; /* border-gray-600 */
            color: #f3f4f6; /* text-gray-100 */
            border-radius: 0.5rem; /* rounded-lg */
            padding: 0.75rem; /* p-3 */
        }
        .form-group input[type="file"] {
            padding: 0.5rem;
            font-size: 0.875rem;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6; /* border-blue-500 */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
        
        .editor-card {
            background-color: #1f2937; /* bg-gray-800 */
            border-radius: 0.75rem; /* rounded-xl */
            border: 1px solid #374151; /* border-gray-700 */
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .editor-card-header {
            background-color: #374151; /* bg-gray-700 */
            padding: 0.75rem 1rem;
            font-size: 1.125rem; /* text-lg */
            font-weight: 600; /* semibold */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .editor-card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .editor-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        .editor-card-grid .form-group {
            margin-bottom: 0; 
        }

        .dynamic-list-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
            align-items: center;
            padding: 0.5rem;
            border-radius: 0.5rem;
            background-color: #374151; /* bg-gray-700 */
        }
        
        .dynamic-list-item-content {
             display: contents; 
        }
        
        .patrol-item .dynamic-list-item-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            grid-column: 1 / 2;
        }
        
         .armament-item .dynamic-list-item-content {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 0.5rem;
            grid-column: 1 / 2;
        }
        
         .systeme-item .dynamic-list-item-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            grid-column: 1 / 2;
        }
        
        .astroport-item .dynamic-list-item-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            grid-column: 1 / 2;
        }
        .lieu-item .dynamic-list-item-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            grid-column: 1 / 2;
        }
        .lieu-item textarea {
             width: 100%;
             background-color: #4b5563; /* bg-gray-600 */
             border: 1px solid #374151; /* border-gray-700 */
             color: #f3f4f6; /* text-gray-100 */
             border-radius: 0.5rem;
             padding: 0.5rem;
             font-size: 0.875rem;
             min-height: 60px;
        }
        
        /* Styles pour la matrice des distances */
        .distance-matrix {
            font-size: 0.75rem; /* text-xs */
            white-space: nowrap;
        }
        .distance-matrix th, .distance-matrix td {
            padding: 4px 6px;
        }
        .distance-matrix .sticky {
            position: sticky;
            z-index: 10;
        }
        .distance-matrix .left-0 {
            left: 0;
        }


        /* Style pour la liste des vaisseaux */
        .ship-list-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #374151; /* bg-gray-700 */
            padding: 1rem;
            border-radius: 0.75rem;
        }
        .ship-list-item img {
            width: 50px;
            height: 50px;
            border-radius: 0.5rem;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid #4b5563;
        }
        .ship-list-item-info {
            flex-grow: 1;
        }
        .ship-list-item-info .nom {
            font-weight: 600;
            font-size: 1.125rem;
            color: #fff;
        }
        .ship-list-item-info .modele {
            font-size: 0.875rem;
            color: #9ca3af;
        }
        
        /* STYLES POUR LES RÉSULTATS DÉTAILLÉS */
        .trip-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem; /* text-sm */
        }
        .trip-table th, .trip-table td {
            border: 1px solid #374151; /* border-gray-700 */
            padding: 6px 4px;
            text-align: center;
        }
        .trip-table th {
            background-color: #374151; /* bg-gray-700 */
            font-weight: 600;
            font-size: 0.75rem; /* text-xs */
        }
        .trip-table input {
            width: 50px;
            padding: 4px;
            text-align: center;
            background-color: #4b5563; /* bg-gray-600 */
            border: 1px solid #374151; /* border-gray-700 */
            border-radius: 4px;
            color: #f3f4f6;
        }
        .trip-leg {
            margin-bottom: 1rem;
            border-left: 3px solid #3b82f6; /* border-blue-500 */
            padding-left: 0.75rem;
        }
        .trip-leg h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .peril-link {
            color: #60a5fa; /* text-blue-400 */
            cursor: pointer;
            text-decoration: underline;
        }
        .status-ok { color: #9ca3af; /* text-gray-400 */ }
        .status-success { color: #34d399; /* text-green-400 */ font-weight: 600; }
        .status-danger { color: #f87171; /* text-red-400 */ font-weight: 600; }

        #map-container.selection-mode {
            outline: 3px solid #3b82f6; /* Ligne bleue */
            cursor: crosshair;
        }
        .quadrant-select-btn {
            flex-shrink: 0;
        }
        
        /* Styles pour la visionneuse d'image */
        #image-viewer-modal {
            display: none; /* Caché par défaut */
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            cursor: pointer; /* Clic pour fermer */
        }
        #image-viewer-modal.show {
            display: flex;
        }
        #image-viewer-modal img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
            cursor: default; /* C curseur normal sur l'image */
        }
        #image-viewer-modal .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 110;
            background-color: #1f2937; /* bg-gray-800 */
            border-radius: 99px;
            padding: 0.5rem;
            color: white;
            cursor: pointer;
        }

        /* Style pour les sous-cartes (Lunes, etc.) */
        .sub-card {
            background-color: #374151; /* bg-gray-700 */
            border-radius: 0.5rem;
            border: 1px solid #4b5563; /* border-gray-600 */
            overflow: hidden;
            margin-top: 1rem;
        }
        .sub-card-header {
            background-color: #4b5563; /* bg-gray-600 */
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem; /* text-sm */
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sub-card-content {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-[100dvh] flex flex-col overflow-hidden">

    <main class="flex-grow overflow-hidden relative">
        
        <!-- PAGE 1: CARTE INTERACTIVE (Visible par défaut) -->
        <div id="map-page" class="page h-full w-full">
            <div id="map-container" class="h-full w-full overflow-hidden cursor-grab active:cursor-grabbing relative bg-gray-900">
                <div id="col-legend" class="absolute top-0 left-0 z-10 flex text-gray-500 text-xs pointer-events-none" style="transform: translate(30px, 10px)"></div>
                <div id="row-legend" class="absolute top-0 left-0 z-10 flex flex-col text-gray-500 text-xs pointer-events-none" style="transform: translate(10px, 30px)"></div>
                <div id="map-grid"></div>
            </div>
            
            <!-- Bouton flottant pour voir l'itinéraire en cours -->
            <button id="view-trip-map-btn" class="hidden absolute top-4 right-4 z-20 bg-blue-600/90 hover:bg-blue-500 text-white p-3 rounded-full shadow-lg flex items-center justify-center gap-2 border border-blue-400/50">
                <i data-lucide="map-pin" class="w-6 h-6"></i>
                <span class="text-xs font-bold hidden md:inline">Itinéraire</span>
            </button>

            <div class="absolute bottom-4 right-4 z-20 flex flex-col space-y-2">
                 <!-- Bouton Paramètres supprimé -->
                
                <button id="zoom-in" class="bg-gray-800/80 backdrop-blur-sm text-white p-3 rounded-full shadow-lg h-12 w-12 flex items-center justify-center">
                    <i data-lucide="zoom-in" class="w-6 h-6"></i>
                </button>
                <button id="zoom-out" class="bg-gray-800/80 backdrop-blur-sm text-white p-3 rounded-full shadow-lg h-12 w-12 flex items-center justify-center">
                    <i data-lucide="zoom-out" class="w-6 h-6"></i>
                </button>
                <button id="zoom-reset" class="bg-gray-800/80 backdrop-blur-sm text-white p-3 rounded-full shadow-lg h-12 w-12 flex items-center justify-center">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
        
        <!-- PAGE 2: CONFIGURATION ITINÉRAIRE -->
        <div id="itineraire-page" class="page h-full w-full hidden overflow-y-auto bg-gray-900">
            <div class="p-4 max-w-md mx-auto">
                <h1 class="text-2xl font-bold mb-4">Calculer un itinéraire</h1>
                
                <fieldset class="form-group border border-gray-700 p-3 rounded-lg mb-4">
                    <legend class="text-lg font-semibold text-green-400 px-2">Départ</legend>
                    <div class="form-group">
                        <label for="start-quadrant">Quadrant</label>
                        <div class="flex gap-2">
                            <select id="start-quadrant" class="flex-grow"></select>
                            <button type="button" id="start-quadrant-btn" class="quadrant-select-btn p-3 bg-gray-700 rounded-lg hover:bg-gray-600">
                                <i data-lucide="crosshair" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group"><label for="start-system">Système</label><select id="start-system"></select></div>
                    <div class="form-group mb-0"><label for="start-planet">Astre de départ</label><select id="start-planet" disabled></select></div>
                </fieldset>
                
                <fieldset class="form-group border border-gray-700 p-3 rounded-lg mb-4">
                    <legend class="text-lg font-semibold text-amber-400 px-2">Étapes</legend>
                    <div id="etapes-list"><p class="text-gray-500 text-sm">Fonctionnalité d'étapes à venir.</p></div>
                    <button class="w-full mt-2 bg-gray-700 hover:bg-gray-600 p-2 rounded-lg text-sm">+ Ajouter une étape</button>
                </fieldset>

                <fieldset class="form-group border border-gray-700 p-3 rounded-lg mb-4">
                    <legend class="text-lg font-semibold text-red-400 px-2">Arrivée</legend>
                    <div class="form-group">
                        <label for="end-quadrant">Quadrant</label>
                        <div class="flex gap-2">
                            <select id="end-quadrant" class="flex-grow"></select>
                            <button type="button" id="end-quadrant-btn" class="quadrant-select-btn p-3 bg-gray-700 rounded-lg hover:bg-gray-600">
                                <i data-lucide="crosshair" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group"><label for="end-system">Système</label><select id="end-system"></select></div>
                    <div class="form-group mb-0"><label for="end-planet">Astre d'arrivée</label><select id="end-planet" disabled></select></div>
                </fieldset>
                
                <fieldset class="form-group border border-gray-700 p-3 rounded-lg mb-4">
                    <legend class="text-lg font-semibold text-sky-400 px-2">Vaisseau & Paramètres</legend>
                    <div class="form-group">
                        <label for="active-ship-select">Vaisseau Actif</label>
                        <select id="active-ship-select"></select>
                    </div>
                    <div id="active-ship-stats" class="text-sm text-gray-400 space-y-1 mt-2">
                        <!-- Stats injectées par JS -->
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div class="form-group mb-0">
                            <label for="comp-navigation" class="text-xs">Comp. Navigation (Succ. exc.)</label>
                            <input type="number" id="comp-navigation" value="0" min="0" class="p-2">
                        </div>
                        <div class="form-group mb-0">
                            <label for="comp-saut" class="text-xs">Comp. Saut (Succ. exc.)</label>
                            <input type="number" id="comp-saut" value="0" min="0" class="p-2">
                        </div>
                    </div>
                </fieldset>
                
                <button id="calculate-itineraire-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg text-lg">
                    Calculer
                </button>
                
                <!-- Bouton pour voir l'itinéraire existant -->
                <button id="view-trip-form-btn" class="hidden w-full mt-3 bg-green-600 hover:bg-green-500 text-white font-bold p-3 rounded-lg text-lg flex items-center justify-center gap-2">
                    <i data-lucide="eye" class="w-5 h-5"></i>
                    Voir les résultats actuels
                </button>
            </div>
        </div>
        
        <!-- PAGE 3: ÉDITEUR DE SYSTÈME -->
        <div id="system-edit-page" class="page h-full w-full hidden flex flex-col">
            <header class="edit-page-header flex-shrink-0">
                <button id="system-edit-back-btn" class="p-2 rounded-full hover:bg-gray-700">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <h1 id="system-edit-title" class="text-xl font-semibold truncate px-2">Éditer le système</h1>
                <button id="system-edit-save-btn" class="p-2 rounded-full hover:bg-gray-700">
                    <i data-lucide="save" class="w-6 h-6"></i>
                </button>
            </header>
            <div id="system-edit-content" class="flex-grow overflow-y-auto p-4 space-y-4">
                <!-- Les cartes de l'éditeur seront injectées ici par JS -->
            </div>
        </div>

        <!-- PAGE 4: CATALOGUE DE VAISSEAUX -->
        <div id="ship-catalog-page" class="page h-full w-full hidden flex flex-col">
            <header class="edit-page-header flex-shrink-0">
                <div class="w-10"></div> 
                <h1 class="text-xl font-semibold">Vaisseaux</h1>
                <button id="add-new-ship-btn" class="p-2 rounded-full hover:bg-gray-700">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </header>
            <div id="ship-list-container" class="flex-grow overflow-y-auto p-4 space-y-4">
                <!-- Liste des vaisseaux injectée par JS -->
            </div>
        </div>

    </main>
    
    <!-- Barre de Navigation Inférieure -->
    <footer class="flex-shrink-0 w-full bg-gray-800 border-t border-gray-700 grid grid-cols-3">
        <button id="nav-map-btn" class="nav-btn p-3 flex flex-col items-center text-blue-400">
            <i data-lucide="map" class="w-6 h-6"></i>
            <span class="text-xs mt-1">Carte</span>
        </button>
        <button id="nav-itineraire-btn" class="nav-btn p-3 flex flex-col items-center text-gray-400">
            <i data-lucide="milestone" class="w-6 h-6"></i>
            <span class="text-xs mt-1">Itinéraire</span>
        </button>
        <button id="nav-ship-btn" class="nav-btn p-3 flex flex-col items-center text-gray-400">
            <i data-lucide="rocket" class="w-6 h-6"></i>
            <span class="text-xs mt-1">Vaisseaux</span>
        </button>
    </footer>

    <!-- --- MODALES (Bottom Sheets) --- -->
    
    <div id="modal-backdrop" class="hidden"></div>
    
    <!-- Modale Paramètres supprimée -->
    
    <div id="quadrant-modal" class="bottom-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h2 id="quadrant-modal-title" class="text-xl font-bold">Quadrant</h2>
            <button class="modal-close-btn" onclick="closeModal()">
                 <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="quadrant-modal-content" class="modal-content"></div>
        <div class="p-4 border-t border-gray-700">
            <button id="add-system-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold p-3 rounded-lg">
                Nouveau Système
            </button>
        </div>
    </div>
    
    <div id="itineraire-results-modal" class="bottom-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <!-- Bouton Réduire -->
            <button class="modal-minimize-btn" onclick="closeModal()" title="Réduire">
                 <i data-lucide="minus" class="w-5 h-5"></i>
            </button>
            
            <h2 class="text-xl font-bold text-center">Résultats</h2>
            
             <button class="modal-close-btn" onclick="closeModal()">
                 <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <!-- Contenu mis à jour par JS -->
        <div id="itineraire-results-modal-content" class="modal-content"></div> 
        <!-- Pied de page pour le résumé et l'actualisation -->
        <div id="itineraire-results-footer" class="p-4 border-t border-gray-700 flex-shrink-0">
             <div id="trip-summary-total" class="text-center font-semibold mb-3"></div>
             <button id="update-trip-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg">

            function getNestedProperty(obj, path) {
                const properties = path.replace(/\[(\w+)\]/g, '.$1').split('.');
                let current = obj;
                for (const prop of properties) {
                    if (current === null || typeof current === 'undefined' || !current.hasOwnProperty(prop)) return undefined;
                    current = current[prop];
                }
                return current;
            }
            function setNestedProperty(obj, path, value) {
                const properties = path.replace(/\[(\w+)\]/g, '.$1').split('.');
                let current = obj;
                for (let i = 0; i < properties.length - 1; i++) {
                    const prop = properties[i];
                    if (!current[prop] || typeof current[prop] !== 'object') current[prop] = /^\d+$/.test(properties[i+1]) ? [] : {};
                    current = current[prop];
                }
                current[properties[properties.length - 1]] = value;
            }
            window.updateSystemField = (path, value) => { if (currentEditCoord === null || currentEditIndex === -1) return; let system = systemsData[currentEditCoord][currentEditIndex]; setNestedProperty(system, path, value); if (path.includes('orbite') || path === 'soleil.distanceSaut') renderSystemEditor(system); };
            window.addFieldToArray = (path, template) => { if (currentEditCoord === null || currentEditIndex === -1) return; let system = systemsData[currentEditCoord][currentEditIndex]; let array = getNestedProperty(system, path); if (!Array.isArray(array)) { setNestedProperty(system, path, []); array = getNestedProperty(system, path); } array.push(JSON.parse(JSON.stringify(template))); renderSystemEditor(system); };
            window.removeFieldFromArray = (path) => { if (currentEditCoord === null || currentEditIndex === -1) return; let system = systemsData[currentEditCoord][currentEditIndex]; const parts = path.replace(/\[(\w+)\]/g, '.$1').split('.'); const index = parseInt(parts.pop(), 10); const arrayPath = parts.join('.'); let array = getNestedProperty(system, arrayPath); if (Array.isArray(array) && index >= 0 && index < array.length) { array.splice(index, 1); renderSystemEditor(system); } };
            window.handleAtmosphereChange = (selectElement, path) => { const value = selectElement.value; updateSystemField(path + '.atmosphere', value); const detailInputId = `atmo-detail-${path.replace(/\W/g,'')}`; const detailInput = document.getElementById(detailInputId); if (detailInput) { if (value === 'Toxique' || value === 'Dangereux') { detailInput.style.display = 'block'; } else { detailInput.style.display = 'none'; updateSystemField(path + '.atmosphereDetail', ''); } } };

            function generateTrip() {
                const selectedShipIndex = parseInt(activeShipSelect.value, 10);
                if (selectedShipIndex === -1 || !shipCatalog[selectedShipIndex]) { alert("Veuillez sélectionner un vaisseau valide."); return; }
                const selectedShip = shipCatalog[selectedShipIndex];

                const points = []; const allQuadrants = [];
                const start = getPointData(startQuadrantSelect, startSystemSelect, startPlanetSelect);
                if (!start.isValid) { alert("Le point de départ est incomplet."); return; }
                points.push(start); allQuadrants.push(start.quadrant);
                
                const end = getPointData(endQuadrantSelect, endSystemSelect, endPlanetSelect);
                if (!end.isValid) { alert("Le point d'arrivée est incomplet."); return; }
                points.push(end);
                if (!allQuadrants.includes(end.quadrant)) { allQuadrants.push(end.quadrant); }

                currentTripData = { legs: [], allQuadrants: allQuadrants, autonomy: selectedShip.autonomie || 10000 };
                
                for (let i = 0; i < points.length - 1; i++) {
                    const currentPoint = points[i]; const nextPoint = points[i+1];
                    const currentSystemData = systemsData[currentPoint.quadrant].find(s => s.nom === currentPoint.system);
                    const nextSystemData = systemsData[nextPoint.quadrant].find(s => s.nom === nextPoint.system);

                    if (currentPoint.value !== 'limite_saut') currentTripData.legs.push(calculateInterplanetaryLeg(currentSystemData, currentPoint, `Départ de ${currentPoint.system}`, 'departure', selectedShip));
                    if (currentPoint.quadrant !== nextPoint.quadrant) currentTripData.legs.push(calculateHyperspaceLeg(currentPoint.quadrant, nextPoint.quadrant, selectedShip));
                    if (nextPoint.value !== 'limite_saut') currentTripData.legs.push(calculateInterplanetaryLeg(nextSystemData, nextPoint, `Arrivée à ${nextPoint.system}`, 'arrival', selectedShip));
                }
                
                // Activer les boutons "Voir Itinéraire" car des données existent
                viewTripFormBtn.classList.remove('hidden');
                viewTripMapBtn.classList.remove('hidden');
                
                showPage('map-page');
                drawItineraryPath(allQuadrants);
                displayItineraryResults();
                openModal(itineraireResultsModal);
            }

                if (index > -1) {
                    if (isEditingModel) { shipModels.splice(index, 1); saveShipModels(); } else { shipCatalog.splice(index, 1); saveShipCatalog(); }
                    renderShipCatalogPage(); populateActiveShipSelect(); closeModal();
                }
            });
            
            activeShipSelect.addEventListener('change', updateActiveShipStats);

            // --- INITIALISATION ---
            loadData(); loadShipCatalog(); loadShipModels(); 
            generateMap(); populateItineraireSelects(); populateActiveShipSelect(); renderShipCatalogPage(); 
            updateTransform(); lucide.createIcons(); 
        }); 
    </script>
</body>
</html>
