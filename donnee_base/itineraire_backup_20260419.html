<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Itinéraire - Metal Adventures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --gold: #c8a464;
      --bg: #1a1a1a;
      --bg2: #2c2c2c;
      --bg3: #383838;
      --border: #444;
      --text: #e0e0e0;
      --text-light: #f1f1f1;
      --primary: #5bc0de;
      --danger: #d9534f;
      --success: #5cb85c;
      --warning: #f0ad4e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
    #app-header { height: 48px; background: var(--bg2); border-bottom: 2px solid var(--gold); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
    #app-header h1 { color: var(--gold); font-size: 1.1rem; margin: 0; }
    #app-header .header-actions { display: flex; gap: 8px; }
    #app-header button, #app-header a.hbtn { background: var(--bg3); border: 1px solid var(--border); color: var(--text-light); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-block; }
    #app-header button:hover, #app-header a.hbtn:hover { border-color: var(--gold); }
    #main-layout { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
    #carte-zone { flex: 1; overflow: hidden; position: relative; touch-action: none; background: #111; cursor: grab; }
    #carte-zone.grabbing { cursor: grabbing; }
    #carte-zone.picking { cursor: crosshair; }
    #carte-zone.picking .quad:hover { outline: 2px solid var(--gold); z-index: 1; }
    #carte-zone.picking::after { content: '🎯 Cliquez sur un quadrant'; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 4px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; z-index: 100; pointer-events: none; white-space: nowrap; }
    #carte-wrapper { position: absolute; transform-origin: 0 0; display: inline-flex; flex-direction: column; }
    #col-legende { display: grid; grid-template-columns: 20px repeat(40, 20px); height: 20px; }
    #ligne-wrapper { display: flex; }
    #row-legende { display: grid; grid-template-rows: repeat(40, 20px); width: 20px; }
    .col-header, .row-header { font-size: 0.6rem; color: #666; text-align: center; display: flex; align-items: center; justify-content: center; }
    .row-header { justify-content: flex-end; padding-right: 2px; }
    #carte { display: grid; grid-template-columns: repeat(40, 20px); grid-template-rows: repeat(40, 20px); background: url('carte_ma.jpg') 0 0/800px 800px no-repeat; }
    .quad { width: 20px; height: 20px; background: rgba(200,164,100,0.07); border: 1px solid rgba(200,164,100,0.15); cursor: pointer; }
    .quad:hover { background: rgba(200,164,100,0.4); }
    .quad.has-system { background: rgba(91,192,222,0.25); border-color: rgba(91,192,222,0.5); }
    .quad.selected-dep { background: rgba(217,83,79,0.7) !important; border-color: var(--danger) !important; }
    .quad.selected-arr { background: rgba(92,184,92,0.7) !important; border-color: var(--success) !important; }
    .quad.selected-eta { background: rgba(255,165,0,0.7) !important; border-color: var(--warning) !important; }
    .quad.path { background: rgba(240,173,78,0.3); border-color: var(--warning); }
    #bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 2px solid var(--gold); max-height: 55vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease; z-index: 20; border-radius: 12px 12px 0 0; }
    #bottom-sheet.open { transform: translateY(0); }
    #bottom-sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 8px auto; cursor: pointer; }
    #bottom-sheet-title { display: flex; justify-content: space-between; align-items: center; color: var(--gold); font-weight: bold; padding: 0 12px 4px; font-size: 0.95rem; }
    #bottom-sheet-content { padding: 0 16px 16px; }
    .point-buttons { display: flex; gap: 4px; margin-top: 4px; }
    .btn-point { padding: 6px 10px; border-radius: 4px; border: 2px solid; font-size: 0.8rem; font-weight: bold; cursor: pointer; background: transparent; }
    .btn-dep { border-color: var(--danger); color: var(--danger); }
    .btn-dep:hover, .btn-dep.active { background: var(--danger); color: white; }
    .btn-eta { border-color: var(--warning); color: var(--warning); }
    .btn-eta:hover, .btn-eta.active { background: var(--warning); color: #111; }
    .btn-arr { border-color: var(--success); color: var(--success); }
    .btn-arr:hover, .btn-arr.active { background: var(--success); color: white; }
    #fab-calculer { position: absolute; bottom: 12px; right: 12px; z-index: 30; background: var(--success); color: white; border: none; border-radius: 28px; padding: 14px 20px; font-size: 1rem; font-weight: bold; box-shadow: 0 4px 16px rgba(0,0,0,0.5); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: bottom 0.3s; }
    #fab-calculer.sheet-open { bottom: calc(55vh + 12px); }
    #result-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 100; transform: translateY(100%); transition: transform 0.35s ease; display: flex; flex-direction: column; }
    #result-panel.open { transform: translateY(0); }
    #result-panel.minimized { transform: translateY(calc(100% - 52px)); cursor: pointer; }
    #result-panel.minimized #result-body { pointer-events: none; }
    #result-header { background: var(--bg2); border-bottom: 2px solid var(--gold); padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; height: 52px; box-sizing: border-box; }
    #result-header h2 { color: var(--gold); margin: 0; font-size: 1.1rem; flex-grow: 1; }
    #btn-close-result { background: none; border: none; color: var(--text-light); font-size: 1.8rem; cursor: pointer; padding: 0; }
    #btn-minimize-result { background: none; border: 1px solid var(--border); color: var(--text-light); font-size: 0.9rem; cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: transform 0.3s; flex-shrink: 0; }
    #result-panel.minimized #btn-minimize-result { transform: rotate(180deg); }
    #result-body { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
    .result-summary { background: #111; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center; font-size: 0.9rem; border: 1px solid var(--border); line-height: 1.9; }
    .result-leg { border-left: 4px solid var(--primary); margin-bottom: 16px; background: var(--bg2); border-radius: 0 8px 8px 0; }
    .result-leg-header { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .result-leg-header h3 { color: var(--primary); margin: 0; font-size: 0.9rem; }
    .leg-info { font-size: 0.78rem; color: #aaa; margin-top: 2px; }
    .result-leg-body { padding: 0 14px 14px; }
    .result-leg.collapsed .result-leg-body { display: none; }
    .result-leg.collapsed .caret { transform: rotate(-90deg); }
    .caret { transition: transform 0.2s; display: inline-block; }
    .trip-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .trip-table th, .trip-table td { border: 1px solid var(--border); padding: 4px 5px; text-align: center; }
    .trip-table th { background: var(--bg3); color: #bbb; font-size: 0.75rem; }
    .trip-table input[type=number] { width: 50px; padding: 2px 4px; text-align: center; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 3px; }
    .peril-link { color: var(--gold); cursor: pointer; text-decoration: underline; font-size: 0.82rem; }
    .status-ok { color: var(--success); }
    .status-done { color: var(--primary); font-weight: bold; }
    .status-warn { color: var(--warning); font-weight: bold; }
    .btn-action { width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-gold { background: var(--bg3); border: 1px solid var(--gold) !important; color: var(--gold); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal-sheet { background: var(--bg2); width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px; transform: translateY(100%); transition: transform 0.3s ease; }
    .modal-backdrop.open .modal-sheet { transform: translateY(0); }
    .modal-title { color: var(--gold); font-weight: bold; font-size: 1rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; color: var(--text-light); font-size: 1.5rem; cursor: pointer; }
    .params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .param-field label { font-size: 0.8rem; color: #bbb; display: block; margin-bottom: 4px; }
    .param-field input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 4px; font-size: 0.95rem; }
    .param-field.full { grid-column: 1 / -1; }
    .peril-sheet h2 { color: var(--gold); margin: 0 0 8px; }
    .detail-section { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .detail-section-hdr { background: var(--bg3); padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .detail-section-hdr h3 { margin: 0; font-size: 0.88rem; color: var(--gold); }
    .detail-section-body { padding: 10px 12px; }
    .detail-section.collapsed .detail-section-body { display: none; }
    .detail-section.collapsed .d-caret { transform: rotate(-90deg); }
    .d-caret { transition: transform 0.2s; display: inline-block; font-size: 0.7rem; color: #aaa; }
    .detail-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-bottom: 6px; }
    .detail-stat { font-size: 0.8rem; line-height: 1.4; }
    .detail-stat strong { color: #bbb; font-weight: normal; }
    .detail-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: bold; margin: 2px 2px 2px 0; }
    .badge-atmos { background: #1e3a4a; color: #7dd3fc; }
    .badge-grav { background: #2d2a1e; color: #fcd34d; }
    .badge-sec { background: #1e2d1e; color: #86efac; }
    .badge-com { background: #2d1e2d; color: #d8b4fe; }
    .detail-desc { font-style: italic; color: #ccc; font-size: 0.82rem; line-height: 1.5; margin: 6px 0 0; }
    .detail-list { padding-left: 16px; margin: 4px 0 0; font-size: 0.82rem; }
    .detail-list li { margin-bottom: 3px; }
    .detail-merch { font-size: 0.78rem; color: #aaa; background: var(--bg3); border-radius: 4px; padding: 5px 8px; margin-top: 6px; border: 1px solid var(--border); }
    .peril-sheet .desc { font-style: italic; color: #ccc; margin-bottom: 10px; line-height: 1.5; }
    .peril-sheet .pstats { font-weight: bold; color: var(--primary); margin: 8px 0; }
    .peril-sheet .psection { margin-top: 12px; }
    .peril-sheet .psection-title { font-weight: bold; color: #aaa; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; font-size: 0.85rem; }
    .peril-sheet p { white-space: pre-wrap; font-size: 0.88rem; line-height: 1.5; margin: 0; }
    .historique-item { background: var(--bg3); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .historique-item .hinfo { flex-grow: 1; }
    .historique-item .hinfo strong { color: var(--gold); font-size: 0.9rem; }
    .historique-item .hinfo small { color: #888; font-size: 0.75rem; display: block; }
    .historique-item .hactions { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-hist-load { padding: 5px 10px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .btn-hist-del { padding: 5px 8px; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .admin-category { margin-bottom: 6px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .admin-cat-header { padding: 8px 12px; background: var(--bg3); cursor: pointer; display: flex; justify-content: space-between; color: var(--gold); font-size: 0.85rem; font-weight: bold; }
    .admin-cat-body { display: none; padding: 6px; }
    .admin-category.open .admin-cat-body { display: block; }
    .pt-row { display:flex; align-items:center; gap:4px; padding:4px 0; border-bottom:1px solid var(--border); font-size:0.82rem; }
    .pt-row:last-child { border-bottom:none; }
    .pt-role { width:38px; font-size:0.72rem; font-weight:bold; flex-shrink:0; }
    .pt-label { flex:1; color:var(--text-light); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pt-move { background:none; border:none; color:#666; cursor:pointer; padding:0 3px; font-size:0.9rem; line-height:1; }
    .pt-move:hover { color:#ccc; }
    .pt-del { background:none; border:none; color:#666; cursor:pointer; padding:0 3px; font-size:0.9rem; }
    .pt-del:hover { color:var(--danger); }
    .admin-peril-row input { flex-grow: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 3px 7px; border-radius: 3px; font-size: 0.82rem; }
    .admin-tabs { display:flex; gap:0; margin-bottom:12px; border-bottom:2px solid var(--border); }
    .admin-tab { padding:8px 14px; background:none; border:none; color:#888; cursor:pointer; font-size:0.82rem; font-weight:bold; border-bottom:2px solid transparent; margin-bottom:-2px; transition:color 0.2s; }
    .admin-tab.active { color:var(--gold); border-bottom-color:var(--gold); }
    .admin-tab:hover { color:var(--text-light); }
    .admin-tab-content { display:none; }
    .admin-tab-content.active { display:block; }
    .admin-table-item { display:flex; align-items:center; justify-content:space-between; background:var(--bg3); padding:8px 12px; border-radius:6px; margin-bottom:6px; gap:8px; }
    .admin-table-item .atname { flex:1; font-size:0.88rem; }
    .admin-table-item .attype { font-size:0.72rem; padding:2px 8px; border-radius:10px; flex-shrink:0; }
    .admin-table-item .attype.ip { background:#1e3a4a; color:#7dd3fc; }
    .admin-table-item .attype.hs { background:#2d1e2d; color:#d8b4fe; }
    .admin-table-item .at-actions { display:flex; gap:4px; flex-shrink:0; }
    .admin-table-item .at-actions button { padding:4px 8px; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:3px; cursor:pointer; font-size:0.75rem; }
    .admin-table-item .at-actions button:hover { border-color:var(--gold); }
    .admin-table-item .at-actions .btn-del { color:var(--danger); }
    .peril-edit-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .peril-edit-header button { padding:5px 10px; background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:4px; cursor:pointer; font-size:0.82rem; }
    .peril-edit-header input { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--gold); padding:6px 10px; border-radius:4px; font-size:0.95rem; font-weight:bold; }
    .peril-edit-cat { margin-bottom:8px; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .peril-edit-cat-hdr { padding:8px 12px; background:var(--bg3); cursor:pointer; display:flex; justify-content:space-between; align-items:center; color:var(--gold); font-size:0.85rem; font-weight:bold; }
    .peril-edit-cat-body { display:none; padding:8px; }
    .peril-edit-cat.open .peril-edit-cat-body { display:block; }
    .peril-edit-item { border:1px solid var(--border); border-radius:4px; margin-bottom:6px; padding:8px; background:var(--bg); }
    .peril-edit-item-hdr { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .peril-edit-item-hdr .pe-nom { color:var(--text-light); font-size:0.85rem; font-weight:bold; }
    .peril-edit-item-hdr .pe-range { color:#777; font-size:0.72rem; }
    .peril-edit-fields { display:none; margin-top:8px; }
    .peril-edit-item.open .peril-edit-fields { display:block; }
    .pe-field { margin-bottom:6px; }
    .pe-field label { display:block; font-size:0.75rem; color:#888; margin-bottom:2px; }
    .pe-field input,.pe-field textarea { width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:5px 8px; border-radius:3px; font-size:0.82rem; box-sizing:border-box; }
    .pe-field textarea { min-height:50px; resize:vertical; font-family:inherit; }
    .pe-field-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:6px; }
    .pe-field-check { display:flex; align-items:center; gap:6px; font-size:0.82rem; }
    .pe-field-check input[type=checkbox] { width:auto; }
    .assign-row { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--bg3); border-radius:4px; margin-bottom:4px; font-size:0.82rem; }
    .assign-row .ar-label { flex:1; }
    .assign-row .ar-coord { color:#888; font-size:0.72rem; width:50px; flex-shrink:0; }
    .assign-row select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:3px; font-size:0.82rem; max-width:180px; }
    .btn-add-table { display:flex; gap:8px; margin-bottom:12px; }
    .btn-add-table button { flex:1; padding:8px; border:1px dashed var(--border); background:transparent; color:var(--primary); border-radius:6px; cursor:pointer; font-size:0.82rem; }
    .btn-add-table button:hover { border-color:var(--gold); color:var(--gold); }
    .sys-edit-card { border:1px solid var(--border); border-radius:6px; margin-bottom:10px; overflow:hidden; background:var(--bg); }
    .sys-edit-card.card-sun { border-left:3px solid #ffcc00; }
    .sys-edit-card.card-planet { border-left:3px solid #6495c8; }
    .sys-edit-card.card-moon { border-left:3px solid #ccc; margin-left:16px; }
    .sys-edit-card.card-patrol { border-left:3px solid var(--danger); }
    .sys-edit-card.card-system { border-left:3px solid var(--primary); }
    .sys-card-hdr { padding:8px 10px; background:var(--bg3); display:flex; align-items:center; gap:6px; cursor:pointer; }
    .sys-card-hdr h4 { margin:0; font-size:0.85rem; color:var(--gold); flex:1; }
    .sys-card-hdr input[type=text] { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text-light); padding:4px 8px; border-radius:3px; font-size:0.85rem; font-weight:bold; }
    .sys-card-hdr .se-caret { font-size:0.7rem; color:#888; transition:transform 0.2s; }
    .sys-card-body { padding:8px 10px; }
    .sys-edit-card.collapsed .sys-card-body { display:none; }
    .sys-edit-card.collapsed .se-caret { transform:rotate(-90deg); }
    .se-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
    .se-grid.g3 { grid-template-columns:1fr 1fr 1fr; }
    .se-field { display:flex; flex-direction:column; }
    .se-field.full { grid-column:1/-1; }
    .se-field label { font-size:0.72rem; color:#888; margin-bottom:2px; }
    .se-field input,.se-field select,.se-field textarea { width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:5px 8px; border-radius:3px; font-size:0.82rem; box-sizing:border-box; }
    .se-list-row input,.se-list-row select,.se-list-row textarea { color:var(--text); }
    .se-field textarea { min-height:45px; resize:vertical; font-family:inherit; }
    .se-field input:disabled { background:var(--bg3); color:#888; }
    .se-fieldset { border:1px solid var(--border); border-radius:4px; padding:8px; margin-top:6px; grid-column:1/-1; }
    .se-fieldset legend { padding:0 6px; color:var(--gold); font-size:0.78rem; }
    .se-list-row { display:flex; gap:6px; align-items:center; margin-bottom:4px; }
    .se-list-row input,.se-list-row select { flex:1; }
    .se-list-row textarea { flex:1; min-height:35px; }
    .se-btn-add { display:block; width:100%; padding:4px; border:1px dashed var(--border); background:none; color:var(--primary); border-radius:3px; cursor:pointer; font-size:0.75rem; margin-top:4px; }
    .se-btn-add:hover { border-color:var(--gold); color:var(--gold); }
    .se-btn-del { background:var(--danger); color:white; border:none; border-radius:3px; cursor:pointer; padding:3px 6px; font-size:0.72rem; flex-shrink:0; }
    .se-btn-del:hover { opacity:0.8; }
    .faction-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; margin-bottom:6px; }
    .faction-item img { width:32px; height:32px; border-radius:4px; object-fit:cover; flex-shrink:0; }
    .faction-item .fi-info { flex:1; min-width:0; }
    .faction-item .fi-name { font-weight:bold; color:var(--gold); font-size:0.85rem; }
    .faction-item .fi-desc { font-size:0.72rem; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .faction-picker { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
    .faction-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border:1px solid var(--border); border-radius:12px; cursor:pointer; font-size:0.78rem; background:var(--bg2); color:var(--text); transition:border-color 0.15s; }
    .faction-chip:hover { border-color:var(--gold); }
    .faction-chip.active { border-color:var(--primary); background:var(--primary); color:white; }
    .faction-chip img { width:18px; height:18px; border-radius:3px; object-fit:cover; }
    .se-actions { display:flex; gap:6px; margin-top:6px; }
    .se-actions button { flex:1; padding:6px; border-radius:4px; cursor:pointer; font-size:0.82rem; border:none; }
    .sys-header-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .sys-header-fields .se-field input,.sys-header-fields .se-field select { font-size:0.88rem; }
    .sys-header-fields .se-field.full { grid-column:1/-1; }
    .point-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; border: 1px solid; }
    .point-badge.dep { border-color: var(--danger); color: var(--danger); }
    .point-badge.eta { border-color: var(--warning); color: var(--warning); }
    .point-badge.arr { border-color: var(--success); color: var(--success); }
    #points-summary { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    @media (min-width: 768px) {
      #main-layout { flex-direction: row; }
      #carte-zone { flex: 7; }
      #desktop-panel { flex: 3; min-width: 300px; max-width: 400px; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
      #desktop-panel-content { flex: 1; overflow-y: auto; padding: 12px; }
      #bottom-sheet { display: none !important; }
      #fab-calculer { display: none !important; }
      #result-panel { display: none !important; }
      .dp-section { margin-bottom: 14px; }
      .dp-section-title { font-size: 0.72rem; font-weight: bold; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
      .btn-action { font-size: 0.88rem; padding: 9px; }
      #desktop-result .result-leg-header h3 { font-size: 0.85rem; }
    }
    @media (max-width: 767px) { #desktop-panel { display: none; } }

<body>
  <header id="app-header">
    <h1>⚡ Itinéraire</h1>
    <div class="header-actions">
      <a href="index.html" class="hbtn">← Accueil</a>
      <button id="btn-params" title="Paramètres">⚙</button>
      <button id="btn-historique" title="Historique">📋</button>
      <button id="btn-admin" title="Périls">≡</button>
    </div>
  </header>

  <div id="main-layout">
    <div id="carte-zone">
      <div id="carte-wrapper">
        <div id="col-legende"></div>
        <div id="ligne-wrapper">
          <div id="row-legende"></div>
          <div id="carte"></div>
        </div>
      </div>
    </div>

    <div id="bottom-sheet">
      <div id="bottom-sheet-handle"></div>
      <div id="bottom-sheet-title"><span id="bs-title-text">—</span><div id="bs-quad-btns" style="display:flex;gap:4px"></div></div>
      <div id="bs-trip-state"></div>
      <div id="bottom-sheet-content"></div>
    </div>

    <button id="fab-calculer">🚀 Calculer</button>

    <div id="desktop-panel">
      <div id="desktop-panel-content">
        <div class="dp-section">
          <div class="dp-section-title">Quadrant sélectionné</div>
          <div id="dp-quad-info" style="font-size:0.85rem;color:#aaa;padding:6px;background:var(--bg3);border-radius:4px;min-height:50px;">Tapez sur un quadrant.</div>
        </div>
        <div class="dp-section">
          <div class="dp-section-title">Itinéraire</div>
          <div id="dp-points" style="font-size:0.82rem;margin-bottom:8px;min-height:30px;color:#aaa;line-height:1.8;">Aucun point.</div>
          <button id="btn-calc-desktop" class="btn-action btn-primary" style="display:none">🚀 Calculer</button>
        </div>
        <div class="dp-section" id="dp-result-section" style="display:none">
          <div class="dp-section-title">Résultat</div>
          <div id="dp-summary" class="result-summary" style="font-size:0.82rem;margin-bottom:10px;"></div>
          <div id="dp-legs"></div>
          <button class="btn-action btn-primary" id="btn-update-desktop">Actualiser</button>
          <button class="btn-action btn-gold" style="border:none" id="btn-save-hist-desktop">💾 Sauvegarder</button>
        </div>
      </div>
    </div>
  </div>

  <div id="result-panel">
    <div id="result-header">
      <button id="btn-close-result">←</button>
      <h2>Rapport de Voyage</h2>
      <button id="btn-minimize-result" title="Réduire">▼</button>
    </div>
    <div id="result-body">
      <div id="points-summary"></div>
      <div id="mob-summary" class="result-summary"></div>
      <div id="mob-legs"></div>
      <button class="btn-action btn-primary" id="btn-update-mobile">Actualiser</button>
      <button class="btn-action btn-gold" style="border:1px solid var(--gold)" id="btn-save-hist-mobile">💾 Sauvegarder</button>
    </div>
  </div>

  <div id="modal-params" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">⚙ Paramètres <button class="modal-close" data-modal="modal-params">✕</button></div>
      <div class="params-grid">
        <div class="param-field"><label>Vitesse interplanétaire (US/j)</label><input type="number" id="p-ip-spd" value="100" min="1"></div>
        <div class="param-field"><label>Vitesse hyperspace (PC/j)</label><input type="number" id="p-hs-spd" value="1000" min="1"></div>
        <div class="param-field"><label>Autonomie (PC)</label><input type="number" id="p-hs-auto" value="10000" min="0"></div>
      </div>
      <button id="btn-save-params" class="btn-action btn-primary" style="margin-top:14px">Enregistrer</button>
    </div>
  </div>

  <div id="modal-peril" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">Péril <button class="modal-close" data-modal="modal-peril">✕</button></div>

  <div id="modal-historique" class="modal-backdrop">

      <div id="hist-list"></div>
      <div id="hist-empty" style="text-align:center;color:#888;padding:20px;display:none">Aucun itinéraire sauvegardé.</div>
    </div>
  </div>

  <div id="modal-admin" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">≡ Administration <button class="modal-close" data-modal="modal-admin">✕</button></div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="tab-perils">Périls</button>
        <button class="admin-tab" data-tab="tab-factions">Factions</button>
        <button class="admin-tab" data-tab="tab-systemes">Systèmes</button>
        <button class="admin-tab" data-tab="tab-quadrants">Quadrants</button>
      </div>
      <div id="tab-perils" class="admin-tab-content active"></div>
      <div id="tab-factions" class="admin-tab-content"></div>
      <div id="tab-systemes" class="admin-tab-content"></div>
      <div id="tab-quadrants" class="admin-tab-content"></div>
    </div>
  </div>

  <div id="modal-detail" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title"><span id="modal-detail-title">Système</span><button class="modal-close" data-modal="modal-detail">✕</button></div>
      <div id="detail-content" class="peril-sheet"></div>
    </div>
  </div>

  <div id="modal-edit-system" class="modal-backdrop">
    <div class="modal-sheet" style="max-width:720px">

      <div id="edit-sys-content"></div>
    </div>
  </div>

        <div class="se-field" style="margin-bottom:8px"><label>Diminutif</label><input type="text" id="faction-short" placeholder="ex: EG, LPL…" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:3px;width:100%;box-sizing:border-box"></div>
        <div class="se-field" style="margin-bottom:8px"><label>Description</label><textarea id="faction-desc" rows="3" style="width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:3px;font-family:inherit;box-sizing:border-box"></textarea></div>

          "description": "Aux confins du système, là où la lumière de Tchagaan n'est plus qu'une étoile brillante parmi d'autres, dérive le Sans-Nom. Ce planétoïde est une tache d'obscurité, un morceau de nuit qui ne reflète presque aucune lumière. Les senseurs à longue portée détectent une anomalie à sa surface : un sphéroïde d'un noir absolu, géométriquement parfait, qui absorbe toute énergie. C'est un secret endormi, et les légendes locales disent qu'il ne faut surtout pas le réveiller.",
          "lunes": [],

  <script>
  (function(){
    'use strict';

    const LETTRES = ["Α","Β","Γ","Δ","Ε","Ζ","Η","Θ","Ι","Κ","Λ","Μ","Ν","Ξ","Ο","Π","Ρ","Σ","Τ","Υ","Φ","Χ","Ψ","Ω","Α′","Β′","Γ′","Δ′","Ε′","Ζ′","Η′","Θ′","Ι′","Κ′","Λ′","Μ′","Ν′","Ξ′","Ο′","Π′"];

    // ── STATE ──
    let donnees = {};
    let perilsData = {};
    let tripState = { points: [] };
    let currentTripLegs = null;
    let customTables = [];
    let perilAssignments = { systems: {}, quadrants: {} };
    let factions = [];

    // ── DATA ──
    async function loadData() {
      try {
        const s = localStorage.getItem('quadrantsMA');
        if (s) { donnees = JSON.parse(s) || {}; }
        else {
          const el = document.getElementById('quadrants-data');
          if (el && el.textContent.trim()!=='null') { donnees = JSON.parse(el.textContent) || {}; }
          else { try { const r=await fetch('quadrants_MA.json'); donnees=await r.json()||{}; } catch(e2){} }
        }
      } catch(e) { donnees = {}; }

      perilsData = PERILS_DEFAULT;
      try { const a = localStorage.getItem('perilsDataAdmin'); if (a) perilsData = JSON.parse(a); } catch(e) {}
      try { customTables = JSON.parse(localStorage.getItem('customPerilTables')||'[]'); } catch(e) { customTables=[]; }
      try { perilAssignments = JSON.parse(localStorage.getItem('perilAssignments')||'{"systems":{},"quadrants":{}}'); } catch(e) { perilAssignments={systems:{},quadrants:{}}; }
      try { factions = JSON.parse(localStorage.getItem('factions')||'[]'); } catch(e) { factions=[]; }
      if(!factions.length){
        factions=[
          {id:'fac-def-1',name:'Empire Galactique',short:'EG',description:'',icon:''},
          {id:'fac-def-2',name:'Empire de Sol',short:'Sol',description:'',icon:''},
          {id:'fac-def-3',name:'Barrens',short:'B',description:'',icon:''},
          {id:'fac-def-4',name:'Ligue des Planètes Libres',short:'LPL',description:'',icon:''},
          {id:'fac-def-5',name:'Omni-Cartel Galactique',short:'OCG',description:'',icon:''},
          {id:'fac-def-6',name:'Pirate',short:'Pirate',description:'',icon:''}
        ];
        saveFactions();
      }
    }

    function getParams() {
      const def = { ipSpd:100, hsSpd:1000, hsAuto:10000 };
      try { const s = localStorage.getItem('itineraireParams'); if (s) return Object.assign(def, JSON.parse(s)); } catch(e) {}
      return def;
    }
    function saveParams(p) { localStorage.setItem('itineraireParams', JSON.stringify(p)); }

    // ── CARTE ──
    function initCarte() {
      const colLeg = document.getElementById('col-legende');
      colLeg.innerHTML = '<div style="width:20px"></div>' + LETTRES.map(l => `<div class="col-header" style="width:20px;font-size:0.5rem">${l.length <= 2 ? l : ''}</div>`).join('');

      const rowLeg = document.getElementById('row-legende');
      rowLeg.innerHTML = '';
      for(let i=1;i<=40;i++){
        const d=document.createElement('div');
        d.className='row-header';
        d.style.height='20px';
        d.textContent=41-i;
        rowLeg.appendChild(d);
      }

      const carte = document.getElementById('carte');
      carte.innerHTML = '';
      for(let y=0;y<40;y++){
        for(let x=0;x<40;x++){
          const coord = `${LETTRES[x]}-${40-y}`;
          const div = document.createElement('div');
          div.className = 'quad';
          div.dataset.coord = coord;
          if(donnees[coord]&&donnees[coord].length>0) div.classList.add('has-system');
          div.addEventListener('click', ()=>{ if(!isDragging)onCellClick(coord); });
          carte.appendChild(div);
        }
      }
      refreshCarte();
    }

    function refreshCarte() {
      document.querySelectorAll('.quad').forEach(q => {
        q.classList.remove('selected-dep','selected-arr','selected-eta','path');
        const c = q.dataset.coord;
        const pts = tripState.points, n = pts.length;
        if(n>0 && pts[0].quadrant===c) q.classList.add('selected-dep');
        else if(n>1 && pts[n-1].quadrant===c) q.classList.add('selected-arr');
        else if(pts.some((p,i)=>i>0&&i<n-1&&p.quadrant===c)) q.classList.add('selected-eta');
      });
      const pts=tripState.points;
      for(let i=0;i<pts.length-1;i++) markPath(pts[i].quadrant,pts[i+1].quadrant);
    }

    function coordXY(coord){ const p=coord.split('-'); return {x:LETTRES.indexOf(p[0]),y:40-parseInt(p[1])}; }

    function markPath(a,b){
      const ca=coordXY(a),cb=coordXY(b);
      let x0=ca.x,y0=ca.y,x1=cb.x,y1=cb.y;
      const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
      let err=dx-dy;
      const cells=new Set();
      while(true){cells.add(`${x0},${y0}`);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}
      document.querySelectorAll('.quad').forEach(q=>{
        const c=coordXY(q.dataset.coord);
        if(cells.has(`${c.x},${c.y}`)&&!q.classList.contains('selected-dep')&&!q.classList.contains('selected-arr')&&!q.classList.contains('selected-eta'))
          q.classList.add('path');
      });
    }

    // ── PAN/ZOOM ──
    let zoom=1,panX=0,panY=0,panning=false,panSX=0,panSY=0,pinching=false,pinchD0=1,pinchZ0=1;
    let isDragging=false,_dsX=0,_dsY=0;

    function applyT(){ document.getElementById('carte-wrapper').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`; }

    function initPanZoom(){
      const z=document.getElementById('carte-zone');
      z.addEventListener('mousedown',e=>{ panning=true; isDragging=false; _dsX=e.clientX; _dsY=e.clientY; panSX=e.clientX-panX; panSY=e.clientY-panY; z.classList.add('grabbing'); });
      window.addEventListener('mousemove',e=>{ if(!panning)return; if(!isDragging&&(Math.abs(e.clientX-_dsX)>4||Math.abs(e.clientY-_dsY)>4))isDragging=true; panX=e.clientX-panSX; panY=e.clientY-panSY; applyT(); });
      window.addEventListener('mouseup',()=>{ panning=false; z.classList.remove('grabbing'); });
      z.addEventListener('wheel',e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.91; const r=z.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top; const nz=Math.min(Math.max(zoom*f,0.25),6); panX=mx-(mx-panX)*(nz/zoom); panY=my-(my-panY)*(nz/zoom); zoom=nz; applyT(); },{passive:false});
      z.addEventListener('touchstart',e=>{ if(e.touches.length===2){pinching=true;pinchD0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZ0=zoom;}else if(e.touches.length===1){panning=true;panSX=e.touches[0].clientX-panX;panSY=e.touches[0].clientY-panY;} },{passive:true});
      z.addEventListener('touchmove',e=>{ e.preventDefault(); if(e.touches.length===2&&pinching){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);const r=z.getBoundingClientRect();const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;const nz=Math.min(Math.max(pinchZ0*(d/pinchD0),0.25),6);panX=mx-(mx-panX)*(nz/zoom);panY=my-(my-panY)*(nz/zoom);zoom=nz;applyT();}else if(e.touches.length===1&&panning){panX=e.touches[0].clientX-panSX;panY=e.touches[0].clientY-panSY;applyT();} },{passive:false});
      z.addEventListener('touchend',()=>{panning=false;pinching=false;});
    }

    function centerMap(){
      const z=document.getElementById('carte-zone'),r=z.getBoundingClientRect();
      zoom=Math.min(r.width/820,r.height/820,1);
      panX=(r.width-820*zoom)/2; panY=(r.height-820*zoom)/2;
      applyT();
    }

    // ── BOTTOM SHEET (MOBILE) ──
    function onCellClick(coord){
      if(_pickingQuadrant){
        if(_editCoord==='__new__') finishPickQuadrant(coord);
        else { _pickingQuadrant=false; document.getElementById('carte-zone').classList.remove('picking'); relocateSystem(coord); openModal('modal-edit-system'); }
        return;
      }
      const systems=donnees[coord]||[];
      const sheet=document.getElementById('bottom-sheet');
      document.getElementById('bs-title-text').textContent=`Quadrant ${coord}`;
      const qbContainer=document.getElementById('bs-quad-btns');
      qbContainer.innerHTML='';
      const qp={quadrant:coord,systemNom:null,astroNom:null,orbit:0};
      const addBtn=document.createElement('button');
      addBtn.className='btn-point btn-eta';
      addBtn.style.cssText='padding:3px 9px;font-size:0.75rem';
      addBtn.textContent='+ Quadrant';
      addBtn.addEventListener('click',()=>{tripState.points.push({...qp});refreshAll();});
      qbContainer.appendChild(addBtn);
      renderBSTripState();
      const content=document.getElementById('bottom-sheet-content');
      content.innerHTML='';
      // HS peril picker for this quadrant
      const hsRow=document.createElement('div');
      hsRow.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg3)';
      const hsTid=perilAssignments.quadrants[coord]||'';
      hsRow.innerHTML=`<span style="font-size:0.78rem;color:#aaa;white-space:nowrap">⚠️ Périls HS :</span>${_perilTableSelect('hyperspatial',coord,hsTid)}`;
      content.appendChild(hsRow);
      if(systems.length===0){
        const empty=document.createElement('div');
        empty.style.cssText='padding:20px;text-align:center;color:#888;font-style:italic';
        empty.textContent='Quadrant vide.';
        content.appendChild(empty);
      } else {
        systems.forEach((sys,si)=>{
          const sd=document.createElement('div');
          sd.style.cssText='margin-bottom:10px;border:1px solid var(--border);border-radius:6px;overflow:hidden';
          const hdr=document.createElement('div');
          hdr.style.cssText='background:var(--bg3);padding:7px 12px;font-weight:bold;color:var(--gold);font-size:0.88rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center';
          hdr.innerHTML=`<span>${sys.nom||'?'}</span><span style="color:#888;font-weight:normal;font-size:0.76rem">${_factionLabel(sys.faction)} <span style="color:var(--primary)">ℹ</span></span>`;
          hdr.addEventListener('click',()=>showSystemDetail(coord,si));
          sd.appendChild(hdr);
          getAstres(sys).forEach(a=>{
            const pt={quadrant:coord,systemNom:sys.nom,astroNom:a.label,orbit:a.orbit};
            const row=document.createElement('div');
            row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-top:1px solid var(--border)';
            row.innerHTML=`<span style="font-size:0.85rem">${a.label}</span>`;
            const b=document.createElement('button');
            b.className='btn-point btn-eta';
            b.style.cssText='padding:3px 9px;font-size:0.75rem';
            b.textContent='+';
            b.addEventListener('click',()=>{tripState.points.push({...pt});refreshAll();});
            row.appendChild(b);
            sd.appendChild(row);
          });
          content.appendChild(sd);
        });
      }
      sheet.classList.add('open');
      document.getElementById('fab-calculer').classList.add('sheet-open');
      updateDesktopQuadInfo(coord,systems);
    }

    function getAstres(sys){
      const list=[];
      if(sys.soleil?.nom) list.push({label:`☀ ${sys.soleil.nom}`,orbit:0});
      (sys.corpsCelestes||[]).forEach(p=>{ if(p.orbite) list.push({label:p.nom,orbit:parseFloat(p.orbite)||0}); });
      if(sys.soleil?.distanceSaut) list.push({label:'Limite de Saut',orbit:parseFloat(sys.soleil.distanceSaut)||0});
      return list;
    }

    function updateDesktopQuadInfo(coord,systems){
      const el=document.getElementById('dp-quad-info');
      if(!el)return;
      const qp=JSON.stringify({quadrant:coord,systemNom:null,astroNom:null,orbit:0});
      const addQBtn=`<button onclick='APP.add(${JSON.stringify(qp)})' class="btn-point btn-eta" style="padding:2px 8px;font-size:0.7rem">+</button>`;
      let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><strong style="color:var(--gold)">${coord}</strong>${addQBtn}</div>`;
      // HS peril picker (desktop)
      const _hsTid=perilAssignments.quadrants[coord]||'';
      h+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)"><span style="font-size:0.72rem;color:#aaa;white-space:nowrap">⚠️ HS :</span>${_perilTableSelect('hyperspatial',coord,_hsTid)}</div>`;
      if(!systems.length){el.innerHTML=h+`<span style="color:#888;font-size:0.8rem">Quadrant vide</span>`;return;}
      systems.forEach((sys,si)=>{
        h+=`<div style="margin-top:5px"><span style="font-weight:bold;cursor:pointer;text-decoration:underline dotted" onclick="showDetail('${coord}',${si})">${sys.nom}</span> <span style="color:#888;font-size:0.78rem">${_factionLabel(sys.faction)}</span>`;
        getAstres(sys).forEach(a=>{
          const pj=JSON.stringify({quadrant:coord,systemNom:sys.nom,astroNom:a.label,orbit:a.orbit});
          h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:3px;padding-top:3px;border-top:1px solid var(--border)">
            <span style="font-size:0.8rem">${a.label}</span>
            <button onclick='APP.add(${JSON.stringify(pj)})' class="btn-point btn-eta" style="padding:2px 8px;font-size:0.7rem">+</button></div>`;
        });
        h+=`</div>`;
      });
      el.innerHTML=h;
    }

    function refreshAll(){
      refreshCarte();
      updateDesktopPointsList();
      renderBSTripState();
    }

    function updateDesktopPointsList(){
      const el=document.getElementById('dp-points');
      const btn=document.getElementById('btn-calc-desktop');
      if(!el)return;
      const pts=tripState.points,n=pts.length;
      const lbl=p=>p.astroNom?`${p.astroNom} (${p.quadrant})`:p.quadrant;
      const roleColor=i=>i===0?'var(--danger)':i===n-1?'var(--success)':'var(--warning)';
      const roleName=i=>i===0?'Dép':i===n-1?'Arr':`Étp ${i}`;
      if(!n){el.innerHTML='<span style="color:#888">Aucun point.</span>';btn.style.display='';return;}
      el.innerHTML=pts.map((p,i)=>`
        <div class="pt-row">
          <span class="pt-role" style="color:${roleColor(i)}">${roleName(i)}</span>
          <span class="pt-label">${lbl(p)}</span>
          <button class="pt-move" onclick="movePt(${i},-1)" ${i===0?'disabled style="opacity:.3"':''} title="Monter">▲</button>
          <button class="pt-move" onclick="movePt(${i},1)" ${i===n-1?'disabled style="opacity:.3"':''} title="Descendre">▼</button>
          <button class="pt-del" onclick="removePt(${i})" title="Supprimer">✕</button>
        </div>`).join('');
      btn.style.display='';
    }

    window.APP={
      add(j){tripState.points.push(JSON.parse(j));refreshAll();}
    };

    window.removePt=function(idx){ tripState.points.splice(+idx,1); refreshAll(); };
    window.movePt=function(idx,dir){
      const pts=tripState.points, ni=+idx+dir;
      if(ni<0||ni>=pts.length)return;
      [pts[+idx],pts[ni]]=[pts[ni],pts[+idx]];
      refreshAll();
    };

    function renderBSTripState(){
      const el=document.getElementById('bs-trip-state');
      if(!el)return;
      const pts=tripState.points,n=pts.length;
      if(!n){el.innerHTML='';return;}
      const lbl=p=>p.astroNom?`${p.astroNom} (${p.quadrant})`:p.quadrant;
      const roleColor=i=>i===0?'var(--danger)':i===n-1?'var(--success)':'var(--warning)';
      const roleName=i=>i===0?'Dép':i===n-1?'Arr':`Étp ${i}`;
      const items=pts.map((p,i)=>`
        <span style="display:inline-flex;align-items:center;gap:3px;background:var(--bg3);border-radius:4px;padding:2px 5px">
          <span style="color:${roleColor(i)};font-size:0.7rem;font-weight:bold">${roleName(i)}</span>
          <span style="font-size:0.78rem">${lbl(p)}</span>
          <button onclick="movePt(${i},-1)" style="background:none;border:none;color:#666;cursor:pointer;padding:0 1px;font-size:0.7rem" ${i===0?'disabled':''}>&#9650;</button>
          <button onclick="movePt(${i},1)" style="background:none;border:none;color:#666;cursor:pointer;padding:0 1px;font-size:0.7rem" ${i===n-1?'disabled':''}>&#9660;</button>
          <button onclick="removePt(${i})" style="background:none;border:none;color:#888;cursor:pointer;padding:0 2px;font-size:0.8rem">✕</button>
        </span>`);
      el.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border)">${items.join('')}</div>`;
    }

    function _perilTableSelect(type, assignKey, currentTableId){
      const tables=customTables.filter(t=>t.type===type);
      let h=`<select onchange="_perilAssign('${type}','${escH(assignKey)}',this.value)" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:3px;font-size:0.78rem;max-width:200px">`;
      h+=`<option value="">Défaut</option>`;
      tables.forEach(t=>{h+=`<option value="${t.id}"${currentTableId===t.id?' selected':''}>${escH(t.name)}</option>`;});
      h+=`</select>`;
      return h;
    }
    window._perilAssign=function(type,key,val){
      if(type==='interplanetaire'){ if(val)perilAssignments.systems[key]=val; else delete perilAssignments.systems[key]; }
      else{ if(val)perilAssignments.quadrants[key]=val; else delete perilAssignments.quadrants[key]; }
      saveAssignments();
    };

    function _perilTableSummary(tableId,type){
      let cats;
      if(!tableId){ cats=(perilsData[type]||{}).categories||[]; }
      else{ const t=customTables.find(t=>t.id===tableId); cats=t?t.categories:(perilsData[type]||{}).categories||[]; }
      if(!cats.length) return '<div style="color:#888;font-size:0.78rem;font-style:italic">Aucun péril défini.</div>';
      let h='';
      cats.forEach(cat=>{
        h+=`<div style="margin-top:6px"><div style="font-size:0.78rem;font-weight:bold;color:var(--gold);margin-bottom:2px">${escH(cat.nom)} <span style="color:#888;font-weight:normal">(${cat.seuilMin}–${cat.seuilMax})</span></div>`;
        (cat.perils||[]).forEach(p=>{
          h+=`<div style="display:flex;align-items:baseline;gap:6px;padding:2px 0 2px 8px;font-size:0.75rem;border-bottom:1px solid var(--border)"><span style="color:#888;min-width:32px">${p.seuilMin}–${p.seuilMax}</span><span style="color:var(--text)">${escH(p.nom)}</span></div>`;
        });
        h+=`</div>`;
      });
      return h;
    }

    function showSystemDetail(coord,si){
      const sys=(donnees[coord]||[])[si];
      if(!sys)return;
      const jl=parseFloat(sys.soleil?.distanceSaut)||0;
      function section(title,body,open=true){
        return `<div class="detail-section${open?'':' collapsed'}">
          <div class="detail-section-hdr" onclick="this.closest('.detail-section').classList.toggle('collapsed')">
            <h3>${title}</h3><span class="d-caret">▼</span>
          </div><div class="detail-section-body">${body}</div></div>`;
      }
      let h=`<div style="margin-bottom:14px">`;
      h+=`<h2 style="color:var(--gold);margin:0 0 4px;font-size:1.05rem">${sys.nom||'Système'}</h2>`;
      if(sys.faction)h+=`<div style="color:#aaa;font-size:0.82rem">${_factionLabel(sys.faction,true)}${sys.isFrontiere?` · <span style="color:var(--warning)">Frontière</span>`:''}</div>`;
      const meta=[];
      if(sys.route)meta.push(`🛤 Route : ${sys.route}`);
      if(sys.gouvernement)meta.push(`⚖ ${sys.gouvernement}`);
      if(meta.length)h+=`<div style="color:#aaa;font-size:0.78rem;margin-top:3px">${meta.join(' ')}</div>`;
      h+=`</div>`;
      if(sys.description)h+=section('📋 Description',`<p class="detail-desc">${sys.description}</p>`);
      if(sys.soleil){
        let sb=`<div class="detail-stats">`;
        const sf={Classe:sys.soleil.classe,'Diamètre (K)':sys.soleil.diametre,'Dist. saut (US)':sys.soleil.distanceSaut};
        for(const[k,v]of Object.entries(sf))if(v)sb+=`<div class="detail-stat"><strong>${k} :</strong> ${v}</div>`;
        sb+=`</div>`;
        if(sys.soleil.description)sb+=`<p class="detail-desc">${sys.soleil.description}</p>`;
        if(sys.soleil.activiteSolaire?.length){sb+=`<div style="margin-top:6px;font-size:0.8rem;font-weight:bold;color:#bbb">Activité solaire</div><ul class="detail-list">`;sys.soleil.activiteSolaire.forEach(a=>sb+=`<li>Dist. ${a.distance} : ${a.consequence}</li>`);sb+=`</ul>`;}
        h+=section(`☀ ${sys.soleil.nom||'Étoile'}`,sb);
      }
      (sys.corpsCelestes||[]).forEach(p=>{
        const orb=parseFloat(p.orbite)||0;
        const ds=jl>0?(jl-orb).toFixed(0)+' US':'—';

    // ── CALCUL ──
    function roll2D6(){ return Math.floor(Math.random()*6)+1+Math.floor(Math.random()*6)+1; }

    function getFlatList(type,tblOverride){
      const pd=tblOverride||perilsData[type];
      if(!pd?.categories?.length) return [];
      const fl=[];
      const sc=[...pd.categories].sort((a,b)=>a.seuilMin-b.seuilMin);
      for(const cat of sc){ const sp=[...(cat.perils||[])].sort((a,b)=>a.seuilMin-b.seuilMin); for(const p of sp) fl.push(p); }
      return fl;
    }

    function getPeril(type,surplusSuccesses=0,tblOverride){
      const flatList=getFlatList(type,tblOverride);
      if(!flatList.length) return {peril:{nom:'Calme plat',data:{description:'Aucun événement.'}},baseIndex:0};
      const pd=tblOverride||perilsData[type];
      const catRoll=roll2D6();
      const cat=pd.categories.find(c=>catRoll>=c.seuilMin&&catRoll<=c.seuilMax);
      if(!cat?.perils?.length) return {peril:flatList[0],baseIndex:0};
      const modRoll=roll2D6();
      const sp=[...cat.perils].sort((a,b)=>a.seuilMin-b.seuilMin);
      const rolled=sp.find(p=>modRoll>=p.seuilMin&&modRoll<=p.seuilMax)||sp[sp.length-1];
      let baseIndex=flatList.findIndex(p=>p===rolled);
      if(baseIndex===-1) baseIndex=flatList.findIndex(p=>p.nom===rolled.nom);
      if(baseIndex===-1) baseIndex=flatList.length-1;
      const finalIndex=Math.max(0,Math.min(baseIndex-surplusSuccesses,flatList.length-1));
      return {peril:flatList[finalIndex],baseIndex};
    }

    function resolvePeril(type,baseIndex,skill,tblOverride){
      const flatList=getFlatList(type,tblOverride);
      if(!flatList.length) return {nom:'Calme plat',data:{description:'Aucun événement.'}};
      const finalIndex=Math.max(0,Math.min(baseIndex-skill,flatList.length-1));
      return flatList[finalIndex];
    }

    function genDayData(type,days,skill,tblOverride){
      return Array.from({length:days},(_,i)=>{
        const r=getPeril(type,skill,tblOverride);
        return {day:i+1,peril:r.peril,baseIndex:r.baseIndex,surf:0,conso:0};
      });
    }

    function getTableForLeg(type,quadrant,systemNom){
      if(type==='interplanetaire'&&systemNom){
        const tid=perilAssignments.systems[`${quadrant}/${systemNom}`];
        if(tid){ const t=customTables.find(t=>t.id===tid); if(t)return t; }
      }
      if(type==='hyperspatial'&&quadrant){
        const tid=perilAssignments.quadrants[quadrant];
        if(tid){ const t=customTables.find(t=>t.id===tid); if(t)return t; }
      }
      return null;
    }

    function findPerilByNom(nom){
      for(const type of ['interplanetaire','hyperspatial']){
        for(const cat of (perilsData[type]?.categories||[])){
          const p=(cat.perils||[]).find(p=>p.nom===nom);
          if(p)return p;
        }
      }
      return {nom:nom,data:{description:''}};
    }

    function calcHSDist(a,b){ const ca=coordXY(a),cb=coordXY(b); return Math.max(Math.abs(ca.x-cb.x),Math.abs(ca.y-cb.y))*1000; }

    function calculateTrip(){
      if(tripState.points.length<2){alert('Ajoutez au moins 2 points.');return null;}
      const p=getParams();
      const points=tripState.points;
      const legs=[];
      for(let i=0;i<points.length-1;i++){
        const cur=points[i],nxt=points[i+1];
        const curSys=(donnees[cur.quadrant]||[]).find(s=>s.nom===cur.systemNom);
        const nxtSys=(donnees[nxt.quadrant]||[]).find(s=>s.nom===nxt.systemNom);
        if(cur.astroNom&&cur.astroNom!=='Limite de Saut'&&curSys){
          const jl=parseFloat(curSys.soleil?.distanceSaut)||0;
          const dist=Math.abs(jl-cur.orbit);
          const days=Math.max(1,Math.ceil(dist/p.ipSpd));
          const tbl=getTableForLeg('interplanetaire',cur.quadrant,cur.systemNom);
          legs.push({name:`Départ de ${cur.systemNom}`,type:'interplanetaire',from:cur.astroNom,to:`Limite — ${cur.systemNom}`,distance:dist,unit:'US',days,spd:p.ipSpd,skill:0,_tableId:tbl?.id||null,dailyData:genDayData('interplanetaire',days,0,tbl)});
        }
        if(cur.quadrant!==nxt.quadrant){
          const dist=calcHSDist(cur.quadrant,nxt.quadrant);
          const days=Math.max(1,Math.ceil(dist/p.hsSpd));
          const tbl=getTableForLeg('hyperspatial',cur.quadrant,null);
          legs.push({name:`Saut ${cur.quadrant} → ${nxt.quadrant}`,type:'hyperspatial',from:`Q.${cur.quadrant}`,to:`Q.${nxt.quadrant}`,distance:dist,unit:'PC',days,spd:p.hsSpd,skill:0,_tableId:tbl?.id||null,dailyData:genDayData('hyperspatial',days,0,tbl)});
        }
        if(nxt.astroNom&&nxt.astroNom!=='Limite de Saut'&&nxtSys){
          const jl=parseFloat(nxtSys.soleil?.distanceSaut)||0;
          const dist=Math.abs(jl-nxt.orbit);
          const days=Math.max(1,Math.ceil(dist/p.ipSpd));
          const tbl=getTableForLeg('interplanetaire',nxt.quadrant,nxt.systemNom);
          legs.push({name:`Arrivée à ${nxt.systemNom}`,type:'interplanetaire',from:`Limite — ${nxt.systemNom}`,to:nxt.astroNom,distance:dist,unit:'US',days,spd:p.ipSpd,skill:0,_tableId:tbl?.id||null,dailyData:genDayData('interplanetaire',days,0,tbl)});
        }
      }
      return {legs,autonomy:p.hsAuto,points};
    }

    // ── RENDU RÉSULTAT ──
    function summaryHTML(trip){
      let days=0,pc=0,us=0,conso=0;
      trip.legs.forEach(l=>{days+=l.days;l.unit==='PC'?pc+=l.distance:us+=l.distance;});
      trip.legs.filter(l=>l.type==='hyperspatial').forEach(l=>l.dailyData.forEach(d=>conso+=l.spd-d.conso));
      const over=conso>trip.autonomy;
      return `<strong>${days} jour${days>1?'s':''}</strong> · ${Math.round(pc).toLocaleString()} PC · ${us.toFixed(0)} US<br>Conso: <strong>${Math.round(conso).toLocaleString()} / ${trip.autonomy.toLocaleString()} PC</strong>${over?' <span style="color:var(--danger)">⚠ Autonomie dépassée!</span>':''}`;
    }

    function legsHTML(legs,pfx){
      return legs.map((leg,li)=>{
        const isHS=leg.type==='hyperspatial';
        const surfMult=isHS?100:1;
        let rows=''; let cum=0;
        leg.dailyData.forEach((d,di)=>{
          cum+=leg.spd+(d.surf||0)*surfMult;
          const done=cum>=leg.distance;
          rows+=`<tr>
            <td>${d.day}</td>
            <td><span class="peril-link" data-li="${li}" data-di="${di}" data-pfx="${pfx}">${d.peril.nom}</span></td>
            <td><input type="number" id="${pfx}-s-${li}-${di}" value="${d.surf}" step="1" style="width:52px"></td>
            ${isHS?`<td><input type="number" id="${pfx}-c-${li}-${di}" value="${d.conso}" step="100"></td><td>${(leg.spd-d.conso).toLocaleString()}</td>`:''}
            <td style="font-size:0.72rem">${Math.min(cum,leg.distance).toFixed(0)}/${leg.distance.toFixed(0)}</td>
            <td>${done?'<span class="status-done">Arr.</span>':'<span class="status-ok">→</span>'}</td>
          </tr>`;
        });
        return `<div class="result-leg" id="${pfx}-leg-${li}">
          <div class="result-leg-header" onclick="toggleLeg(this)">
            <div><h3>${leg.name}</h3><div class="leg-info">${leg.from} → ${leg.to} · ${leg.days}j · ${leg.distance.toFixed(0)} ${leg.unit}</div></div>
            <div style="display:flex;align-items:center;gap:8px" onclick="event.stopPropagation()">
              <label style="font-size:0.72rem;color:#aaa;display:flex;align-items:center;gap:4px;white-space:nowrap">
                Succ. exc. (${isHS?'Saut':'Cap'})
                <input type="number" id="${pfx}-sk-${li}" value="${leg.skill||0}" min="0"
                  style="width:38px;padding:2px 4px;background:var(--bg);border:1px solid var(--border);color:var(--text-light);border-radius:3px;font-size:0.8rem">
              </label>
              <span class="caret">▼</span>
            </div>
          </div>
          <div class="result-leg-body">
            <table class="trip-table">
              <thead><tr><th>J</th><th>Péril</th><th>Surf${isHS?' (×100&nbsp;PC)':' (US)'}</th>${isHS?'<th>◁Conso</th><th>PC/j</th>':''}<th>Dist</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
      }).join('');
    }

    window.toggleLeg=function(hdr){ hdr.closest('.result-leg').classList.toggle('collapsed'); };

    function readInputs(legs,pfx){
      legs.forEach((leg,li)=>{
        const ski=document.getElementById(`${pfx}-sk-${li}`);
        if(ski){
          const newSkill=parseInt(ski.value)||0;
          if(newSkill!==(leg.skill||0)){
            leg.skill=newSkill;
            const tbl=leg._tableId?customTables.find(t=>t.id===leg._tableId):null;
            leg.dailyData.forEach(d=>{ d.peril=resolvePeril(leg.type,d.baseIndex,newSkill,tbl); });
          }
        }
        leg.dailyData.forEach((d,di)=>{
          const si=document.getElementById(`${pfx}-s-${li}-${di}`);
          if(si)d.surf=parseFloat(si.value)||0;
          if(leg.type==='hyperspatial'){const ci=document.getElementById(`${pfx}-c-${li}-${di}`);if(ci)d.conso=parseFloat(ci.value)||0;}
        });
      });
    }

    function renderTrip(trip,isMob){
      if(isMob){
        const pts=tripState.points, n=pts.length;
        const lbl=p=>p.astroNom?p.astroNom:p.quadrant;
        const badges=[];
        if(n>0)badges.push(`<span class="point-badge dep">Dép: ${lbl(pts[0])}</span>`);
        pts.slice(1,n-1).forEach(e=>badges.push(`<span class="point-badge eta">Étp: ${lbl(e)}</span>`));
        if(n>1)badges.push(`<span class="point-badge arr">Arr: ${lbl(pts[n-1])}</span>`);
        document.getElementById('points-summary').innerHTML=badges.join('');
        document.getElementById('mob-summary').innerHTML=summaryHTML(trip);

        ml.innerHTML=legsHTML(trip.legs,'mob');

        dl.innerHTML=legsHTML(trip.legs,'dsk');
        attachPerilEvents(dl,trip.legs);
      }
    }

    function doCalc(isMob){
      const t=calculateTrip();
      if(!t)return;
      currentTripLegs=t;
      renderTrip(t,isMob);
    }

    function doUpdate(pfx,isMob){
      if(!currentTripLegs)return;
      readInputs(currentTripLegs.legs,pfx);

    function getHist(){ try{return JSON.parse(localStorage.getItem('itineraireHistorique')||'[]');}catch(e){return[];} }
    function setHist(h){ localStorage.setItem('itineraireHistorique',JSON.stringify(h)); }

    function saveCurrentTrip(){
      if(!currentTripLegs){alert('Calculez un itinéraire d\'abord.');return;}
      try{
        const name=prompt('Nom:',`${tripState.points[0]?.systemNom||'?'} → ${tripState.points[tripState.points.length-1]?.systemNom||'?'}`);
        if(!name)return;
        const h=getHist();
        const legsSnapshot=currentTripLegs.legs.map(leg=>({
          name:leg.name,type:leg.type,from:leg.from,to:leg.to,
          distance:leg.distance,unit:leg.unit,days:leg.days,spd:leg.spd,skill:leg.skill||0,_tableId:leg._tableId||null,
          dailyData:leg.dailyData.map(d=>({day:d.day,perilNom:d.peril?.nom||'Inconnu',baseIndex:d.baseIndex!=null?d.baseIndex:0,surf:d.surf||0,conso:d.conso||0}))
        }));
        h.unshift({id:Date.now(),name,date:new Date().toLocaleDateString('fr-FR'),
          points:JSON.parse(JSON.stringify(tripState.points)),
          autonomy:currentTripLegs.autonomy,
          legsSnapshot});
        if(h.length>30)h.pop();
        setHist(h);
        alert('Sauvegardé!');

    function renderHist(){
      const h=getHist();
      const el=document.getElementById('hist-list');
      const empty=document.getElementById('hist-empty');
      if(!h.length){el.innerHTML='';empty.style.display='';return;}
      empty.style.display='none';
      el.innerHTML=h.map((item,idx)=>`
        <div class="historique-item">
          <div class="hinfo"><strong>${item.name}</strong><small>${item.date}</small></div>
          <div class="hactions">
            <button class="btn-hist-load" onclick="HIST.load(${idx})">Charger</button>
            <button class="btn-hist-del" onclick="HIST.del(${idx})">✕</button>
          </div>
        </div>`).join('');
    }

    window.HIST={
      load(idx){
        const h=getHist(); if(!h[idx])return;
        const entry=h[idx];
        tripState.points=JSON.parse(JSON.stringify(entry.points||entry.tripState?.points||(()=>{const ts=entry.tripState;return ts?[ts.depart,...(ts.etapes||[]),ts.arrivee].filter(Boolean):[];})()));
        refreshAll();
        closeModal('modal-historique');
        if(entry.legsSnapshot){
          const tblFor=tid=>tid?customTables.find(t=>t.id===tid):null;
          const legs=entry.legsSnapshot.map(leg=>({
            ...leg,
            dailyData:leg.dailyData.map(d=>({
              day:d.day,
              baseIndex:d.baseIndex!=null?d.baseIndex:0,
              peril:d.baseIndex!=null?resolvePeril(leg.type,d.baseIndex,leg.skill||0,tblFor(leg._tableId)):findPerilByNom(d.perilNom),
              surf:d.surf||0,conso:d.conso||0
            }))
          }));
          currentTripLegs={legs,autonomy:entry.autonomy||getParams().hsAuto,points:tripState.points};
          renderTrip(currentTripLegs,window.innerWidth<768);
        }
      },
      del(idx){ const h=getHist(); h.splice(idx,1); setHist(h); renderHist(); }
    };

    function initFactionModal(){
      document.getElementById('faction-icon-input').addEventListener('change',function(){
        const file=this.files[0]; if(!file)return;
        if(file.size>200*1024){alert('Image trop volumineuse (max 200 Ko)');this.value='';return;}
        const reader=new FileReader();
        reader.onload=e=>{
          document.getElementById('faction-icon-data').value=e.target.result;
          const prev=document.getElementById('faction-icon-preview');
          prev.src=e.target.result; prev.style.display='block';
        };
        reader.readAsDataURL(file);
      });

          h+=`<div class="pe-field-row"><div class="pe-field"><label>Senseurs</label><input type="number" value="${d.senseurs||0}" onchange="ADMIN.updP('${tableId}',${ci},${pi},'data.senseurs',+this.value)"></div><div class="pe-field"><label>Sc. Stellaires</label><input type="number" value="${d.sciencesStellaires||0}" onchange="ADMIN.updP('${tableId}',${ci},${pi},'data.sciencesStellaires',+this.value)"></div><div class="pe-field-check"><label><input type="checkbox" ${d.mobile?'checked':''} onchange="ADMIN.updP('${tableId}',${ci},${pi},'data.mobile',this.checked)"> Mobile</label></div></div>`;

    function _getAdminCats(tableId){
      if(tableId==='default-ip') return perilsData.interplanetaire.categories;
      if(tableId==='default-hs') return perilsData.hyperspatial.categories;
      const t=customTables.find(t=>t.id===tableId); return t?t.categories:null;
    }
    function _saveAdminTable(tableId){
      if(tableId==='default-ip'||tableId==='default-hs') localStorage.setItem('perilsDataAdmin',JSON.stringify(perilsData));
      else saveCustomTables();
    }

    window.ADMIN={
      dupTable(type){
        const src=perilsData[type]; if(!src)return;
        const name=prompt('Nom:',`${type==='interplanetaire'?'IP':'HS'} — Copie`); if(!name)return;
        customTables.push({id:'ct_'+Date.now(),name,type,categories:JSON.parse(JSON.stringify(src.categories))});
        saveCustomTables(); renderPerilsTab();
      },
      dupCustom(id){
        const src=customTables.find(t=>t.id===id); if(!src)return;
        const name=prompt('Nom:',`${src.name} — Copie`); if(!name)return;
        customTables.push({id:'ct_'+Date.now(),name,type:src.type,categories:JSON.parse(JSON.stringify(src.categories))});
        saveCustomTables(); renderPerilsTab();
      },
      delTable(id){
        if(!confirm('Supprimer cette table?'))return;
        customTables=customTables.filter(t=>t.id!==id);
        for(const k in perilAssignments.systems)if(perilAssignments.systems[k]===id)delete perilAssignments.systems[k];
        for(const k in perilAssignments.quadrants)if(perilAssignments.quadrants[k]===id)delete perilAssignments.quadrants[k];
        saveCustomTables(); saveAssignments(); renderPerilsTab(); renderSystemsTab(); renderQuadrantsTab();
      },
      editTable(id){ renderEditTable(id); },
      backToList(){ renderPerilsTab(); },
      renameTable(id,v){ const t=customTables.find(t=>t.id===id); if(t){t.name=v;saveCustomTables();} },
      updP(tableId,ci,pi,path,value){
        const cats=_getAdminCats(tableId); if(!cats)return;
        const peril=cats[ci]?.perils?.[pi]; if(!peril)return;
        const parts=path.split('.');
        if(parts.length===1) peril[parts[0]]=value;
        else if(parts.length===2){ if(!peril[parts[0]])peril[parts[0]]={}; peril[parts[0]][parts[1]]=value; }
        _saveAdminTable(tableId);
      },
      addPeril(tableId,ci){
        const cats=_getAdminCats(tableId); if(!cats||!cats[ci])return;
        const perils=cats[ci].perils||[];
        const mx=perils.length?Math.max(...perils.map(p=>p.seuilMax)):1;
        perils.push({seuilMin:mx+1,seuilMax:mx+1,nom:'Nouveau péril',data:{description:'',mobile:false,senseurs:0,sciencesStellaires:0,definition:'',protocole:'',resultat:''}});
        cats[ci].perils=perils; _saveAdminTable(tableId); renderEditTable(tableId);
      },
      delPeril(tableId,ci,pi){
        if(!confirm('Supprimer ce péril?'))return;
        const cats=_getAdminCats(tableId); if(!cats?.[ci]?.perils)return;
        cats[ci].perils.splice(pi,1); _saveAdminTable(tableId); renderEditTable(tableId);
      },
      addCat(tableId){
        const t=customTables.find(t=>t.id===tableId); if(!t)return;
        const mx=t.categories.length?Math.max(...t.categories.map(c=>c.seuilMax)):1;
        t.categories.push({seuilMin:mx+1,seuilMax:mx+1,nom:'Nouvelle catégorie',perils:[]});
        saveCustomTables(); renderEditTable(tableId);
      },
      assignSys(key,val){ if(val)perilAssignments.systems[key]=val; else delete perilAssignments.systems[key]; saveAssignments(); },
      assignQuad(coord,val){ if(val)perilAssignments.quadrants[coord]=val; else delete perilAssignments.quadrants[coord]; saveAssignments(); },
      resetDefaults(){ if(confirm('Réinitialiser les tables par défaut?')){localStorage.removeItem('perilsDataAdmin');perilsData=JSON.parse(JSON.stringify(PERILS_DEFAULT));renderPerilsTab();} },
      newSystemPrompt(){ closeModal('modal-admin'); newSystem(); },
      newFaction(){ openFactionModal(null); },
      editFaction(id){ const f=factions.find(x=>x.id===id); if(f) openFactionModal(f); },
      delFaction(id){
        if(!confirm('Supprimer cette faction?'))return;
        factions=factions.filter(x=>x.id!==id);
        saveFactions(); renderFactionsTab();
      }
    };

    // ── ÉDITEUR SYSTÈMES ──
    let _editCoord=null, _editSysIdx=-1, _pickingQuadrant=false;
    const _openCards=new Set();

    function sauvegarderDonnees(){
      const save=JSON.parse(JSON.stringify(donnees));
      delete save['__new__'];
      localStorage.setItem('quadrantsMA',JSON.stringify(save));
    }

    function _esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function _sel(opts,cur){ return opts.map(o=>{const v=typeof o==='string'?o:o.v;const l=typeof o==='string'?o:o.l;return `<option value="${_esc(v)}"${v===cur?' selected':''}>${_esc(l)}</option>`;}).join(''); }

    function _factionPicker(cur){
      let h=`<span class="faction-chip ${cur===''?'active':''}" onclick="SYSEDIT.hdr('faction','');renderEditSystem()">Aucune</span>`;
      getFactionsSorted().forEach(f=>{
        const act=cur===f.name?'active':'';
        const img=f.icon?`<img src="${f.icon}" alt="">`:'';
        const lbl=f.short||f.name;
        h+=`<span class="faction-chip ${act}" onclick="SYSEDIT.hdr('faction','${_esc(f.name)}');renderEditSystem()" title="${_esc(f.name)}">${img}${_esc(lbl)}</span>`;
      });
      h+=`<span class="faction-chip" style="border-style:dashed;color:var(--primary)" onclick="openFactionModal(null)">+ Nouvelle</span>`;
      return h;
    }

    function _factionLabel(name,full){
      if(!name) return '';
      const f=factions.find(x=>x.name===name);
      if(f&&f.icon) return `<img src="${f.icon}" alt="${escH(f.name)}" title="${escH(f.name)}" style="width:20px;height:20px;border-radius:3px;object-fit:cover;vertical-align:middle">`;
      if(f&&f.short&&!full) return escH(f.short);
      return escH(name);
    }


    const ROUTES=['','Route Galactique (+1d)','Route Commerciale','Hors des routes (D+1)','Mystérieux (TD)'];
    const GOUVERNEMENTS=['','Anarchie','Aucun','Collectivisme','Corporatiste','Démocratie','Dictature','Monarchie'];
    const ATMOSPHERES=['Respirable','Non respirable','Toxique','Dangereux'];
    const GRAVITES=['Ecrasante (TD, 1S par heure)','Forte (Survie/Technique D+1)','Normale','Faible (Athlétisme, Acrobatie, Pilotage +1d)','Très faible (Dist. x5, Vitesses Véhicules x1.5. Porter : TF)','Aucune'];
    const TECHNOS=[{v:'A',l:'A (Planète évoluée)'},{v:'B',l:'B (Planète industrielle)'},{v:'C',l:'C (Planète sauvage)'}];
    const COMMERCES=['Carrefour galactique (TF)','Carrefour commercial (+1d)','Planète normale','Planète pauvre (D+1)','Planète primitive (TD)'];
    const ASTROPORT_TYPES=['Rudimentaire D+1','Standard','Première classe +1d'];
    const SUN_CLASSES=['Naine rouge','Naine jaune','Géante rouge','Etoile variable','Etoile binaire','Autre'];

    function openEditSystem(coord,sIdx){
      _editCoord=coord;
      _editSysIdx=sIdx;
      donnees[coord]=donnees[coord]||[];
      if(sIdx===-1){
        donnees[coord].push({nom:'Nouveau Système',faction:'',isFrontiere:false,route:'',gouvernement:'',description:'',patrouilles:[],soleil:{nom:'Nouvelle Étoile',description:'',diametre:'',distanceSaut:'',classe:'',activiteSolaire:[]},corpsCelestes:[]});
        _editSysIdx=donnees[coord].length-1;
        if(coord!=='__new__') sauvegarderDonnees();
      }
      _pickingQuadrant=false;
      renderEditSystem();
      openModal('modal-edit-system');
    }

    function newSystem(){
      openEditSystem('__new__',-1);
    }

    function pickQuadrantForNew(){
      closeModal('modal-edit-system');
      _pickingQuadrant=true;
      document.getElementById('carte-zone').classList.add('picking');
    }

    function finishPickQuadrant(coord){
      _pickingQuadrant=false;
      document.getElementById('carte-zone').classList.remove('picking');
      const sys=donnees['__new__']?.[_editSysIdx];
      if(!sys)return;
      donnees[coord]=donnees[coord]||[];
      donnees[coord].push(sys);
      donnees['__new__'].splice(_editSysIdx,1);
      if(!donnees['__new__'].length) delete donnees['__new__'];
      _editCoord=coord;
      _editSysIdx=donnees[coord].length-1;
      sauvegarderDonnees();
      initCarte();
      renderEditSystem();
      openModal('modal-edit-system');
    }

    function relocateSystem(newCoord){
      if(newCoord===_editCoord)return;
      const sys=donnees[_editCoord]?.[_editSysIdx];
      if(!sys)return;
      donnees[_editCoord].splice(_editSysIdx,1);
      if(!donnees[_editCoord].length && _editCoord!=='__new__') delete donnees[_editCoord];
      donnees[newCoord]=donnees[newCoord]||[];
      donnees[newCoord].push(sys);
      _editCoord=newCoord;
      _editSysIdx=donnees[newCoord].length-1;
      sauvegarderDonnees();
      initCarte();
      renderEditSystem();
    }

    window.pickQuadrantForNew=pickQuadrantForNew;
    window.pickQuadrantRelocate=function(){ closeModal('modal-edit-system'); _pickingQuadrant=true; document.getElementById('carte-zone').classList.add('picking'); };

    function _sys(){ return donnees[_editCoord]?.[_editSysIdx]; }

    function renderEditSystem(){
      // Save open state
      document.querySelectorAll('#edit-sys-content .sys-edit-card[data-cid]').forEach(c=>{
        if(!c.classList.contains('collapsed'))_openCards.add(c.dataset.cid); else _openCards.delete(c.dataset.cid);
      });
      const s=_sys(); if(!s)return;
      document.getElementById('edit-sys-title').textContent=`${_editCoord} — ${s.nom||'Système'}`;
      const el=document.getElementById('edit-sys-content');
      const jl=parseFloat(s.soleil?.distanceSaut)||0;
      const isNew=_editCoord==='__new__';
      const coordLabel=isNew?'<span style="color:var(--danger)">Non défini</span>':_editCoord;
      let h='';

      // Coord bar
      h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;background:var(--bg3);border-radius:4px">
        <span style="font-size:0.82rem;color:#aaa">Quadrant :</span>
        <strong style="color:var(--gold);font-size:0.92rem">${coordLabel}</strong>
        <button style="margin-left:auto;padding:4px 12px;background:var(--primary);color:white;border:none;border-radius:3px;cursor:pointer;font-size:0.78rem" onclick="${isNew?'pickQuadrantForNew()':'pickQuadrantRelocate()'}">🎯 ${isNew?'Cibler sur la carte':'Déplacer'}</button>
      </div>`;

      // Header fields
      h+=`<div class="sys-header-fields">
        <div class="se-field"><label>Nom du système</label><input type="text" value="${_esc(s.nom)}" onchange="SYSEDIT.hdr('nom',this.value);document.getElementById('edit-sys-title').textContent=_editCoord+' — '+this.value"></div>
        <div class="se-field full"><label>Faction</label><div class="faction-picker">${_factionPicker(s.faction||'')}</div></div>
        <div class="se-field"><label>Route</label><select onchange="SYSEDIT.hdr('route',this.value)">${_sel(ROUTES,s.route||'')}</select></div>
        <div class="se-field"><label>Gouvernement</label><select onchange="SYSEDIT.hdr('gouvernement',this.value)">${_sel(GOUVERNEMENTS,s.gouvernement||'')}</select></div>
        <div class="se-field"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${s.isFrontiere?'checked':''} onchange="SYSEDIT.hdr('isFrontiere',this.checked)" style="width:auto"> Frontière</label></div>
        <div class="se-field full"><label>Description</label><textarea onchange="SYSEDIT.hdr('description',this.value)">${_esc(s.description)}</textarea></div>
      </div>`;

      // Patrouilles système
      h+=_cardPatrols(s.patrouilles||[]);

      // Soleil
      h+=_cardSun(s.soleil||{});

      // Planètes
      (s.corpsCelestes||[]).forEach((_,pi)=>{ h+=_cardBody(s.corpsCelestes[pi],`corpsCelestes[${pi}]`,false,jl); });

      // Matrice des distances
      h+=_distMatrix(s);

      h+=`<div class="se-actions" style="margin-top:10px">
        <button style="background:var(--primary);color:white" onclick="SYSEDIT.addPlanet()">+ Planète</button>
        <button style="background:var(--danger);color:white" onclick="SYSEDIT.delSystem()">Supprimer système</button>
      </div>`;

      el.innerHTML=h;
    }

    function _coll(cid){ return _openCards.has(cid)?'':'collapsed'; }
    function _cardPatrols(patrols){
      const cid='patrol-sys';
