    function _distMatrix(s){
      const pts=[];
      if(s.soleil)pts.push({nom:s.soleil.nom||'Soleil',orbite:0,type:'Soleil'});
      (s.corpsCelestes||[]).forEach(p=>pts.push({nom:p.nom||'?',orbite:parseFloat(p.orbite)||0,type:'Planète'}));
      if(s.soleil?.distanceSaut)pts.push({nom:'Limite de Saut',orbite:parseFloat(s.soleil.distanceSaut)||0,type:'Limite'});
      if(pts.length<=1)return '';
      const d6=()=>Math.floor(Math.random()*6)+1;
      function getMod(co){ let r; if(co<1){r=d6();return{v:+(0.5*r).toFixed(1),t:`0.5d6(${r})`};} if(co>=60){r=d6()+d6();return{v:10*r,t:`10×2d6(${r})`};} if(co>=30){r=d6();return{v:10*r,t:`10d6(${r})`};} if(co>=15){r=d6();return{v:5*r,t:`5d6(${r})`};} r=d6();return{v:r,t:`1d6(${r})`}; }
      let h=`<div class="sys-edit-card card-system ${_coll('dist-matrix')}" data-cid="dist-matrix"><div class="sys-card-hdr" onclick="this.closest('.sys-edit-card').classList.toggle('collapsed')"><h4>Matrice des distances</h4><span class="se-caret">▼</span></div><div class="sys-card-body" style="overflow-x:auto"><table style="border-collapse:collapse;font-size:0.72rem;width:100%"><thead><tr><th></th>`;
      pts.forEach(p=>h+=`<th style="padding:3px 5px;color:var(--gold);white-space:nowrap">${_esc(p.nom)}</th>`);
      h+='</tr></thead><tbody>';
      pts.forEach(p1=>{
        h+=`<tr><th style="padding:3px 5px;text-align:left;color:#bbb;white-space:nowrap">${_esc(p1.nom)}</th>`;
        pts.forEach(p2=>{
          let c='-';
          if(p1.nom===p2.nom)c='0';
          else if(p1.type==='Soleil')c=`${p2.orbite} US`;
          else if(p2.type==='Soleil')c=`${p1.orbite} US`;
          else if((p1.type==='Planète'&&p2.type==='Limite')||(p1.type==='Limite'&&p2.type==='Planète'))c=`${Math.abs(p1.orbite-p2.orbite).toFixed(2)} US`;
          else if(p1.type==='Planète'&&p2.type==='Planète'){
            const diff=Math.abs(p1.orbite-p2.orbite);const co=Math.min(p1.orbite,p2.orbite);
            const m=getMod(co);c=`${diff.toFixed(1)}+${m.t}=<b>${(diff+m.v).toFixed(1)}</b>`;
          }
          h+=`<td style="padding:3px 5px;border:1px solid var(--border);text-align:center;white-space:nowrap">${c}</td>`;
        });
        h+='</tr>';
      });
      h+='</tbody></table><button class="se-btn-add" style="margin-top:6px" onclick="renderEditSystem()">🎲 Relancer</button></div></div>';
      return h;
    }

    function _resolvePath(obj,path){
      const parts=path.replace(/\[(\w+)\]/g,'.$1').split('.');
      for(let i=0;i<parts.length-1;i++){if(!obj[parts[i]])obj[parts[i]]=isNaN(parts[i+1])?{}:[];obj=obj[parts[i]];}
      return{parent:obj,key:parts[parts.length-1]};
    }

    window.SYSEDIT={
      hdr(k,v){ const s=_sys(); if(!s)return; s[k]=v; sauvegarderDonnees(); },
      fld(path,v){ const s=_sys(); if(!s)return; const r=_resolvePath(s,path); r.parent[r.key]=v; sauvegarderDonnees(); },
      sunClass(sel){
        const w=document.getElementById('sun-cls-custom');
        if(sel.value==='Autre'){w.style.display='flex';}
        else{w.style.display='none';this.fld('soleil.classe',sel.value);}
      },
      atmo(sel,path,pathId){
        const w=document.getElementById('atmo-'+pathId);
        if(w)w.style.display=(sel.value==='Toxique'||sel.value==='Dangereux')?'flex':'none';
        this.fld(path+'.atmosphere',sel.value);
      },
      addItem(arrPath,obj){ const s=_sys(); if(!s)return; const r=_resolvePath(s,arrPath); if(!Array.isArray(r.parent[r.key]))r.parent[r.key]=[]; r.parent[r.key].push(JSON.parse(JSON.stringify(obj))); sauvegarderDonnees(); renderEditSystem(); },
      delItem(arrPath,idx){ const s=_sys(); if(!s)return; const r=_resolvePath(s,arrPath); if(Array.isArray(r.parent[r.key]))r.parent[r.key].splice(idx,1); sauvegarderDonnees(); renderEditSystem(); },
      addSunAct(){ const s=_sys(); if(!s?.soleil)return; if(!s.soleil.activiteSolaire)s.soleil.activiteSolaire=[]; s.soleil.activiteSolaire.push({distance:'',consequence:''}); sauvegarderDonnees(); renderEditSystem(); },
      delSunAct(i){ const s=_sys(); if(!s?.soleil?.activiteSolaire)return; s.soleil.activiteSolaire.splice(i,1); sauvegarderDonnees(); renderEditSystem(); },
      addPlanet(){ const s=_sys(); if(!s)return; if(!s.corpsCelestes)s.corpsCelestes=[]; s.corpsCelestes.push({nom:'Nouvelle Planète',description:'',orbite:'',classe:'',diametre:'',atmosphere:'Respirable',gravite:'Normale',techno:'B',gouvernement:'',commerce:'Planète normale',securite:'',population:'',lunes:[],lieux:[],patrouilles:[],astroports:[],marchandiseA:'',marchandiseB:'',marchandiseC:'',illegal:''}); sauvegarderDonnees(); renderEditSystem(); },
      addMoon(bodyPath){ const s=_sys(); if(!s)return; const r=_resolvePath(s,bodyPath); const body=r.parent[r.key]; if(!body)return; if(!body.lunes)body.lunes=[]; body.lunes.push({nom:'Nouvelle Lune',description:'',lunes:[],lieux:[],patrouilles:[],astroports:[]}); sauvegarderDonnees(); renderEditSystem(); },
      addSub(arrPath,obj){ const s=_sys(); if(!s)return; const r=_resolvePath(s,arrPath); if(!Array.isArray(r.parent[r.key]))r.parent[r.key]=[]; r.parent[r.key].push(JSON.parse(JSON.stringify(obj))); sauvegarderDonnees(); renderEditSystem(); },
      delSub(arrPath,idx){ const s=_sys(); if(!s)return; const r=_resolvePath(s,arrPath); if(Array.isArray(r.parent[r.key]))r.parent[r.key].splice(idx,1); sauvegarderDonnees(); renderEditSystem(); },
      delBody(path){ if(!confirm('Supprimer cet astre et ses lunes?'))return; const s=_sys(); if(!s)return; const parts=path.replace(/\[(\w+)\]/g,'.$1').split('.'); if(parts.length<2)return; let p=s; for(let i=0;i<parts.length-2;i++)p=p[parts[i]]; p[parts[parts.length-2]].splice(+parts[parts.length-1],1); sauvegarderDonnees(); renderEditSystem(); },
      delSystem(){ if(_editCoord==='__new__'){donnees['__new__'].splice(_editSysIdx,1);if(!donnees['__new__'].length)delete donnees['__new__'];closeModal('modal-edit-system');return;} if(!confirm('Supprimer ce système?'))return; donnees[_editCoord].splice(_editSysIdx,1); if(!donnees[_editCoord].length)delete donnees[_editCoord]; sauvegarderDonnees(); closeModal('modal-edit-system'); initCarte(); }
    };
