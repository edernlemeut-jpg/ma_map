<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Adventures — Univers</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=2.0.0">
  <link rel="stylesheet" href="/css/ma-theme.css">
  <style>
    /* Sidebar layout — explicit CSS, ne dépend pas du build Tailwind responsive */
    .univers-layout {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    #univers-sidebar:not(.hidden) {
      display: flex;
      flex-direction: column;
      width: 180px;
      flex-shrink: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    #univers-main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
    }
    @media (max-width: 767px) {
      .univers-layout { flex-direction: column; }
      #univers-sidebar:not(.hidden) {
        flex-direction: row;
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 0.375rem 0.75rem;
        gap: 0.125rem;
      }
      #univers-sidebar .sidebar-label  { display: none; }
      #univers-sidebar .sidebar-group  { display: contents; }
      #univers-sidebar .sidebar-spacer { display: none; }
      #univers-sidebar .tab-btn {
        width: auto !important;
        white-space: nowrap;
        padding: 0.375rem 0.75rem !important;
        flex-shrink: 0;
      }
    }
    /* Séparateurs entre groupes */
    #univers-sidebar .sidebar-group + .sidebar-group {
      margin-top: 0.25rem;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border);
    }
    /* Label catégorie : distinct des boutons */
    #univers-sidebar .sidebar-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0.75rem 0.75rem 0.25rem;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-gray-700 bg-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1>
        <a href="/"><img src="/images/logo.png" alt="Metal Adventures" class="ma-logo-img"></a>
      </h1>
      <nav class="flex items-center gap-4 text-sm">
        <!-- Table context (hidden until loaded) -->
        <span id="header-table-info" class="hidden flex items-center gap-2 text-gray-300 border-r border-gray-600 pr-4 mr-2">
          <span id="header-table-name" class="font-medium"></span>
          <span id="header-table-role" class="text-xs"></span>
          <a href="#" id="header-change-table"
             class="text-blue-400 hover:text-blue-300 text-xs ml-1" title="Changer de table">✕</a>
        </span>
        <span id="header-campaign-date" class="hidden text-xs font-mono px-2 py-1 rounded border border-gray-600 text-yellow-300"></span>
        <span id="auth-user-info" class="hidden flex items-center gap-3">
          <span id="auth-user-name" class="text-gray-300"></span>
          <a href="#" id="auth-logout-btn"
             class="text-red-400 hover:text-red-300 hover:underline">Déconnexion</a>
        </span>
        <a href="/login.html" id="auth-login-link" class="text-blue-400 hover:underline">Connexion</a>
      </nav>
    </div>
  </header>

  <!-- Layout wrapper: sidebar + content -->
  <div class="univers-layout">

    <!-- Sidebar navigation (hidden until data loads) -->
    <aside id="univers-sidebar"
           class="hidden shrink-0 bg-gray-900 overflow-y-auto">

      <!-- Group: Espace -->
      <div class="sidebar-group">
        <div class="sidebar-label">Espace</div>
        <button data-tab="systems" id="tab-btn-systems" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2 relative">
          Systèmes solaires
          <span data-badge="systems" class="hidden ml-auto w-2 h-2 bg-blue-400 rounded-full shrink-0"></span>
        </button>
        <button data-tab="perils" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2 relative">
          Périls
          <span data-badge="perils" class="hidden ml-auto w-2 h-2 bg-blue-400 rounded-full shrink-0"></span>
        </button>
        <button data-tab="quadrants" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2 relative">
          Quadrants
          <span data-badge="quadrants" class="hidden ml-auto w-2 h-2 bg-blue-400 rounded-full shrink-0"></span>
        </button>
        <button data-tab="factions" id="tab-btn-factions" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2 relative">
          Factions
          <span data-badge="factions" class="hidden ml-auto w-2 h-2 bg-blue-400 rounded-full shrink-0"></span>
        </button>
      </div>

      <!-- Group: Personnes -->
      <div class="sidebar-group">
        <div class="sidebar-label">Personnes</div>
        <button data-tab="pj" id="tab-btn-pj" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2">PJ</button>
        <button data-tab="named_npcs" id="tab-btn-named_npcs" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2">PNJ</button>
        <button data-tab="sorcelleries" id="tab-btn-sorcelleries" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2">Sorcellerie</button>
      </div>

      <!-- Group: Vaisseaux -->
      <div class="sidebar-group">
        <div class="sidebar-label">Vaisseaux</div>
        <button data-tab="ships" id="tab-btn-ships" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2">Flotte</button>
        <button data-tab="ship_models" id="tab-btn-ship_models" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2 relative">
          Modèles
          <span data-badge="ship_models" class="hidden ml-auto w-2 h-2 bg-blue-400 rounded-full shrink-0"></span>
        </button>
        <button data-tab="secondary_systems" id="tab-btn-secondary_systems" class="tab-btn w-full text-left px-3 py-2 text-sm flex items-center gap-2">Sys. Sec.</button>
      </div>

      <!-- Switch table -->
      <div class="sidebar-spacer md:mt-auto px-3 pb-4 md:pt-4">
        <button id="btn-switch-table" class="hidden w-full px-3 py-1.5 text-xs rounded-lg border border-gray-700 text-gray-400 hover:text-gray-200 hover:bg-gray-800 flex items-center gap-1.5">⇄ Campagne</button>
      </div>
    </aside>

    <!-- Main scrollable content -->
    <main id="univers-main" class="">
      <div class="px-4 py-6">

    <!-- Loading state -->
    <div id="loading" class="text-center py-12 text-gray-400">Chargement de l'univers…</div>

    <!-- Search bar -->
    <div id="search-bar" class="hidden mb-4 relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">🔍</span>
      <input id="search-input" type="text"
             class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-10 py-3 min-h-[44px] text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors"
             placeholder="Rechercher…" autocomplete="off">
      <button id="search-clear" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 min-w-[44px] min-h-[44px] flex items-center justify-center" title="Effacer">✕</button>
    </div>

    <!-- Tab content panels -->
    <div id="tab-systems" class="tab-panel hidden"></div>
    <div id="tab-factions" class="tab-panel hidden"></div>
    <div id="tab-perils" class="tab-panel hidden"></div>
    <div id="tab-quadrants" class="tab-panel hidden"></div>
    <div id="tab-ship_models" class="tab-panel hidden"></div>
    <div id="tab-ships" class="tab-panel hidden"></div>
    <div id="tab-pj" class="tab-panel hidden"></div>
    <div id="tab-named_npcs" class="tab-panel hidden"></div>
    <div id="tab-secondary_systems" class="tab-panel hidden"></div>
    <div id="tab-sorcelleries" class="tab-panel hidden"></div>

    <!-- Search results -->
    <div id="search-results" class="hidden"></div>

    <!-- Global empty state -->
    <div id="empty-global" class="hidden text-center py-16 px-4">
      <p class="text-2xl mb-4">🔒</p>
      <p class="text-lg text-gray-300 italic max-w-md mx-auto">Les archives du vaisseau sont encore verrouillées. Votre équipage n'a pas assez d'accréditations pour accéder aux données galactiques…</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden text-center py-12">
      <p class="text-red-400">Erreur de chargement. <button id="retry-btn" class="text-blue-400 hover:underline">Réessayer</button></p>
    </div>

      </div><!-- /.max-w-3xl -->
    </main>

  </div><!-- /.flex layout wrapper -->

  <script type="module" src="/js/shared/cold-start.js?v=2.0.2"></script>
  <script type="module" src="/js/univers/compendium-app.js?v=2.0.2"></script>
  <script type="module" src="/js/shared/nav-bar.js"></script>
</body>
</html>
