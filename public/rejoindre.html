<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Adventures — Rejoindre une table</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=2.0.0">
  <link rel="stylesheet" href="/css/ma-theme.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center px-4">

  <div id="join-card" class="w-full max-w-md bg-gray-800 rounded-xl border border-gray-700 p-8 text-center space-y-4">
    <div class="flex justify-center mb-2">
      <img src="/images/logo.png" alt="Metal Adventures" class="h-16 w-auto" style="filter:drop-shadow(0 2px 10px rgba(200,148,58,0.45));">
    </div>
    <h1 class="text-2xl font-bold">Rejoindre une table</h1>
    <p id="join-status" class="text-gray-400">Vérification en cours…</p>
    <div id="join-error" class="hidden bg-red-900/50 text-red-300 rounded p-3 text-sm"></div>
    <div id="join-actions" class="hidden space-y-2">
      <a href="/" class="block w-full py-2 bg-blue-600 hover:bg-blue-500 rounded font-medium transition-colors">
        Aller au tableau de bord
      </a>
    </div>
  </div>

  <script type="module" src="/js/rejoindre.js?v=2.0.0"></script>
</body>
</html>
