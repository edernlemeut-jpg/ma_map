<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Adventures — Carte Interactive</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    #canvas-container {
      touch-action: none;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #route-overlay-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }
    .route-overlay polyline {
      fill: none;
      stroke: rgba(45, 212, 191, 0.95);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(45, 212, 191, 0.5));
    }
    .route-overlay .wp-hit {
      fill: transparent;
      stroke: transparent;
    }
    .route-overlay .wp-dot {
      fill: rgba(20, 184, 166, 0.95);
      stroke: #e2e8f0;
      stroke-width: 2;
    }
    .route-overlay .wp-label {
      fill: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke;
      stroke: rgba(15, 23, 42, 0.8);
      stroke-width: 2;
    }
    .controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 40;
    }
    .control-btn {
      display: inline-block;
      min-height: 44px;
      min-width: 44px;
      background: rgba(59, 130, 246, 0.9);
      color: #ffffff;
      border-radius: 0.25rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-btn:hover {
      background: rgba(59, 130, 246, 1);
    }
    .info-panel {
      position: absolute;
      bottom-4;
      left-4;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(107, 114, 128, 0.5);
      rounded-lg;
      padding: 1rem;
      max-width: 300px;
      color: rgb(229, 231, 235);
      font-size: 0.875rem;
      z-index: 30;
    }

    @keyframes glow {
      0% { filter: drop-shadow(0 0 2px rgba(100, 150, 255, 0.5)); }
      50% { filter: drop-shadow(0 0 8px rgba(100, 150, 255, 1)); }
      100% { filter: drop-shadow(0 0 2px rgba(100, 150, 255, 0.5)); }
    }

    .glow-reveal {
      animation: glow 1000ms ease-in-out 2;
      animation-fill-mode: forwards;
    }

    .preview-disabled {
      opacity: 0.45;
      pointer-events: none;
      filter: grayscale(0.4);
    }
    body.mj-readonly #modal-actions button {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
      filter: grayscale(0.35);
    }

    @media (prefers-reduced-motion: reduce) {
      .glow-reveal {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-gray-700 bg-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold">
        <a href="/" class="hover:text-blue-400 transition-colors">⚙️ Metal Adventures</a>
      </h1>
      <h2 class="text-lg">🗺️ Carte Interactive</h2>
      <nav class="flex items-center gap-4 text-sm">
        <button id="preview-toggle-btn"
                class="hidden min-h-[44px] px-3 py-2 rounded-lg bg-cyan-700 hover:bg-cyan-600 text-white text-xs font-medium transition-colors">
          Mode Preview Joueur
        </button>
        <span id="auth-user-info" class="hidden flex items-center gap-3">
          <span id="auth-user-name" class="text-gray-300"></span>
          <a href="#" id="auth-logout-btn"
             class="text-red-400 hover:text-red-300 hover:underline">Déconnexion</a>
        </span>
        <a href="/login.html" id="auth-login-link" class="text-blue-400 hover:underline">Connexion</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Canvas Container -->
    <div id="canvas-container" class="flex-1 relative">
      <canvas id="galaxy-canvas"></canvas>
      <svg id="route-overlay-svg" aria-hidden="true">
        <g class="route-overlay"></g>
      </svg>
      
      <!-- Controls -->
      <div class="controls flex flex-col gap-2">
        <button id="zoom-in-btn" class="control-btn" title="Zoom avant (+ ou scroll)">+</button>
        <button id="zoom-out-btn" class="control-btn" title="Zoom arrière (- ou scroll)">−</button>
        <button id="reset-btn" class="control-btn" title="Réinitialiser vue">🏠</button>
      </div>

      <!-- Info Panel -->
      <div id="info-panel" class="info-panel hidden">
        <div id="info-content"></div>
      </div>
    </div>

    <!-- System Detail Modal -->
    <div id="system-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
      <div class="bg-gray-800 border border-gray-700 rounded-lg max-w-2xl w-full max-h-96 overflow-y-auto">
        <div class="sticky top-0 bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center justify-between">
          <div>
            <h3 id="modal-title" class="text-xl font-bold"></h3>
            <p id="modal-header-info" class="text-xs text-gray-400"></p>
          </div>
          <button id="modal-close-btn" class="text-gray-400 hover:text-gray-100 text-2xl min-h-[44px] min-w-[44px] flex items-center justify-center">×</button>
        </div>
        <div id="modal-content" class="px-6 py-4 space-y-4 text-sm"></div>
        <div id="modal-actions" class="sticky bottom-0 bg-gray-700 border-t border-gray-600 px-6 py-3 flex gap-2 justify-end">
        </div>
      </div>
    </div>
  </main>

  <div id="preview-frame" class="hidden fixed inset-0 border-4 border-cyan-400 pointer-events-none z-40"></div>
  <button id="preview-exit-btn"
          class="hidden fixed bottom-4 right-4 z-50 min-h-[48px] px-5 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-semibold shadow-xl">
    Quitter Preview
  </button>

  <section id="network-toast" class="hidden fixed top-4 right-4 z-50">
    <div class="bg-emerald-800 text-emerald-100 border border-emerald-500 rounded-lg px-4 py-3 shadow-xl text-sm">
      Reconnecté — données synchronisées
    </div>
  </section>

  <script type="module">
    import { loadSystems, loadQuadrants, validateSystemUpdate, saveSystemUpdate, loadFactions, getConnectionState, handleVersionJump } from '/js/map/map-service.js';
    import { GalaxyMap } from '/js/map/galaxy-map.js';
    import { initAuthUI } from '/js/shared/auth-ui.js';
    import { createPoller } from '/js/shared/poller.js';

    const $ = id => document.getElementById(id);
    const canvas = $('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    const routeOverlay = document.querySelector('.route-overlay');

    function esc(str) {
      if (str == null) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    // Auth check
    const currentUser = await initAuthUI();
    let previewMode = false;
    let previewVersion = 0;
    let lastTapAt = 0;

    // Determine if user is MJ
    function isMJ() {
      return currentUser?.is_admin === true && !previewMode;
    }

    function setPreviewChrome(active) {
      $('preview-frame').classList.toggle('hidden', !active);
      $('preview-exit-btn').classList.toggle('hidden', !active);
      $('preview-toggle-btn').textContent = active ? 'Quitter Preview Joueur' : 'Mode Preview Joueur';
      const actions = $('modal-actions');
      if (actions) {
        actions.classList.toggle('preview-disabled', active);
      }
    }

    // Resize canvas to container
    function resizeCanvas() {
      const container = $('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      map.render();
      renderRouteOverlay();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Load data
    const systems = await loadSystems();
    const quadrants = await loadQuadrants();
    const factions = await loadFactions();

    // Initialize map
    const map = new GalaxyMap(canvas, ctx, systems, quadrants);

    // Polling state
    let lastPollTime = Date.now();
    let pollFailureCount = 0;
    let currentVersion = 0;
    let isPollerRunning = false;
    let isSyncing = false;
    let currentSessionActive = false;
    let activeRoute = null;
    let offlineSince = null;
    let wasOffline = false;

    const SESSION_ACTIVE_INTERVAL = 4000;
    const SESSION_INACTIVE_INTERVAL = 30000;

    // Setup connection indicator
    const header = $('auth-user-info')?.parentElement || document.querySelector('header');
    const indicator = document.createElement('span');
    indicator.id = 'connection-indicator';
    indicator.className = 'ml-2 px-3 py-1 rounded text-sm bg-green-900 text-green-100';
    indicator.title = 'Sync status';
    indicator.textContent = '🟢 Connecté';
    if (header) header.appendChild(indicator);

    const sessionIndicator = document.createElement('span');
    sessionIndicator.id = 'session-indicator';
    sessionIndicator.className = 'ml-2 px-3 py-1 rounded text-sm bg-slate-700 text-slate-200';
    sessionIndicator.title = 'État de la session MJ';
    sessionIndicator.textContent = '🎲 Session inactive';
    if (header) header.appendChild(sessionIndicator);

    function updateSessionIndicator(active) {
      const ind = $('session-indicator');
      if (!ind) return;
      if (active) {
        ind.className = 'ml-2 px-3 py-1 rounded text-sm bg-violet-700 text-violet-100';
        ind.textContent = '🎲 Session active';
      } else {
        ind.className = 'ml-2 px-3 py-1 rounded text-sm bg-slate-700 text-slate-200';
        ind.textContent = '🎲 Session inactive';
      }
    }

    function updateConnectionIndicator(status) {
      const ind = $('connection-indicator');
      if (!ind) return;

      const isOffline = status === 'offline' || status === 'offline-long';
      if (isOffline) {
        if (offlineSince == null) offlineSince = Date.now();
        wasOffline = true;
      } else {
        offlineSince = null;
      }

      document.body.classList.toggle('mj-readonly', isOffline && isMJ());

      switch (status) {
        case 'offline-long':
          ind.className = 'ml-2 px-3 py-1 rounded text-sm bg-red-900 text-red-100';
          ind.textContent = '🔴 Connexion perdue depuis plus d\'une minute. Vérifiez votre réseau.';
          break;
        case 'syncing':
          ind.className = 'ml-2 px-3 py-1 rounded text-sm bg-yellow-900 text-yellow-100';
          ind.textContent = '🔄 Synchronisation';
          break;
        case 'offline':
          ind.className = 'ml-2 px-3 py-1 rounded text-sm bg-red-900 text-red-100';
          ind.textContent = '🔴 Hors ligne';
          break;
        default:
          ind.className = 'ml-2 px-3 py-1 rounded text-sm bg-green-900 text-green-100';
          ind.textContent = '🟢 Connecté';
      }
    }

    function setRouteState(nextRoute) {
      const previousRouteId = activeRoute?.id || null;
      const nextRouteId = nextRoute?.id || null;
      const previousWaypoints = JSON.stringify(activeRoute?.waypoint_ids || []);
      const nextWaypoints = JSON.stringify(nextRoute?.waypoint_ids || []);

      activeRoute = nextRoute && Array.isArray(nextRoute.waypoint_ids) ? nextRoute : null;

      if (previousRouteId !== nextRouteId || previousWaypoints !== nextWaypoints) {
        document.dispatchEvent(new CustomEvent('route:updated', {
          detail: { route: activeRoute }
        }));
      }
    }

    function getScreenPointForSystem(systemId) {
      const pos = map.systemPositions.get(Number(systemId));
      if (!pos) return null;
      return {
        x: map.viewX + pos.x * map.zoom,
        y: map.viewY + pos.y * map.zoom
      };
    }

    function renderRouteOverlay() {
      if (!routeOverlay) return;
      routeOverlay.innerHTML = '';

      if (!activeRoute || !Array.isArray(activeRoute.waypoint_ids) || activeRoute.waypoint_ids.length < 2) {
        return;
      }

      const points = activeRoute.waypoint_ids
        .map(getScreenPointForSystem)
        .filter(Boolean);

      if (points.length < 2) return;

      const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      polyline.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
      routeOverlay.appendChild(polyline);

      points.forEach((point, index) => {
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hit.setAttribute('class', 'wp-hit');
        hit.setAttribute('cx', String(point.x));
        hit.setAttribute('cy', String(point.y));
        hit.setAttribute('r', '22');

        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('class', 'wp-dot');
        dot.setAttribute('cx', String(point.x));
        dot.setAttribute('cy', String(point.y));
        dot.setAttribute('r', '10');

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'wp-label');
        label.setAttribute('x', String(point.x));
        label.setAttribute('y', String(point.y));
        label.textContent = String(index + 1);

        routeOverlay.append(hit, dot, label);
      });
    }

    function refreshConnectionIndicator() {
      const baseState = getConnectionState({
        lastPollTime,
        pollFailureCount,
        syncing: isSyncing
      });
      const longOffline = baseState === 'offline' && offlineSince != null && (Date.now() - offlineSince > 60000);
      updateConnectionIndicator(longOffline ? 'offline-long' : baseState);
    }

    function showNetworkToast() {
      const toast = $('network-toast');
      if (!toast) return;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function handleSyncDelta(syncData, isPreviewPayload = false) {
      if (!syncData) return;

      const nextSessionActive = !!syncData.sessionActive;
      if (nextSessionActive !== currentSessionActive) {
        currentSessionActive = nextSessionActive;
        updateSessionIndicator(currentSessionActive);
        if (poller && typeof poller.setIntervals === 'function') {
          poller.setIntervals({
            intervalMs: currentSessionActive ? SESSION_ACTIVE_INTERVAL : SESSION_INACTIVE_INTERVAL,
            backgroundIntervalMs: SESSION_INACTIVE_INTERVAL,
            immediate: true
          });
        }
      }

      const baseVersion = isPreviewPayload ? previewVersion : currentVersion;
      const newVersion = Number.isInteger(syncData.version) ? syncData.version : baseVersion;
      let didFullRefresh = false;

      if (baseVersion > 0 && newVersion - baseVersion > 1) {
        try {
          const refreshResult = await handleVersionJump(
            baseVersion,
            newVersion,
            async () => loadSystems(),
            {
              onRetry: () => {
                isSyncing = false;
                pollFailureCount = 2;
                refreshConnectionIndicator();
              },
              onFailure: () => {
                isSyncing = false;
                pollFailureCount = Math.max(pollFailureCount, 2);
                refreshConnectionIndicator();
              }
            }
          );

          if (refreshResult.refreshed && Array.isArray(refreshResult.systems)) {
            map.replaceSystems(refreshResult.systems);
            if (isPreviewPayload) {
              previewVersion = refreshResult.version;
            } else {
              currentVersion = refreshResult.version;
            }
            didFullRefresh = true;
          }
        } catch {
          return;
        }
      }

      if (didFullRefresh) {
        lastPollTime = Date.now();
        pollFailureCount = 0;
        isSyncing = false;
        refreshConnectionIndicator();
        return;
      }

      if (syncData?.entities?.systems) {
        const sysDelta = syncData.entities.systems;
        map.applyDeltas(
          sysDelta.revealed || [],
          sysDelta.hidden || [],
          sysDelta.updated || []
        );
      }

      setRouteState(syncData?.entities?.travel_routes?.active || null);
      renderRouteOverlay();

      if (isPreviewPayload) {
        previewVersion = newVersion;
      } else {
        currentVersion = newVersion;
      }
      lastPollTime = Date.now();
      pollFailureCount = 0;
      isSyncing = false;
      refreshConnectionIndicator();
    }

    function createSyncPoller(isPreview) {
      return createPoller({
        url: isPreview ? '/api/preview/sync' : '/api/sync',
        intervalMs: SESSION_INACTIVE_INTERVAL,
        backgroundIntervalMs: SESSION_INACTIVE_INTERVAL,
        enableErrorBackoff: true,
        retryBaseMs: 1000,
        retryMaxMs: 30000,
        onPollStart: () => {
          isSyncing = true;
          refreshConnectionIndicator();
        },
        onData: async (syncData) => {
          await handleSyncDelta(syncData, isPreview);
        },
        onError: () => {
          pollFailureCount++;
          isSyncing = false;
          refreshConnectionIndicator();
        }
      });
    }

    async function setPreviewMode(active) {
      if (previewMode === active) return;
      previewMode = active;
      setPreviewChrome(previewMode);

      if (poller && poller.isRunning()) {
        poller.stop();
      }
      poller = createSyncPoller(previewMode);
      poller.start();
    }

    // Create poller with map delta handler
    let poller = createSyncPoller(false);

    // Start polling
    if (currentUser) {
      poller.start();
      isPollerRunning = true;
    }

    if (currentUser?.is_admin === true) {
      $('preview-toggle-btn').classList.remove('hidden');

      $('preview-toggle-btn').addEventListener('click', async () => {
        await setPreviewMode(!previewMode);
      });

      $('preview-exit-btn').addEventListener('click', async () => {
        await setPreviewMode(false);
      });

      document.addEventListener('touchend', async () => {
        if (!previewMode) return;
        const now = Date.now();
        if (now - lastTapAt < 320) {
          await setPreviewMode(false);
        }
        lastTapAt = now;
      });
    }

    // Recompute indicator so stale polls switch to offline after timeout.
    setInterval(() => {
      if (wasOffline && pollFailureCount === 0) {
        wasOffline = false;
        showNetworkToast();
      }
      refreshConnectionIndicator();
    }, 1000);

    document.addEventListener('route:updated', () => {
      renderRouteOverlay();
    });

    // Animation loop to render glow effects
    function animationLoop() {
      map.render();
      renderRouteOverlay();
      requestAnimationFrame(animationLoop);
    }
    animationLoop();

    // Controls
    $('zoom-in-btn').addEventListener('click', () => map.zoomIn());
    $('zoom-out-btn').addEventListener('click', () => map.zoomOut());
    $('reset-btn').addEventListener('click', () => map.resetView());

    // Modal state
    let currentSystem = null;
    let editingFields = {};

    // Create field element (text/textarea with edit mode)
    function createFieldElement(label, value, key, readonly = false) {
      const container = document.createElement('div');
      container.className = 'flex flex-col gap-1';
      
      const labelEl = document.createElement('p');
      labelEl.className = 'text-xs font-semibold text-gray-400 uppercase';
      labelEl.textContent = label;
      container.appendChild(labelEl);
      
      const isLongText = ['description'].includes(key);
      const isMultiline = ['soleil', 'corpsCelestes', 'patrouilles'].includes(key);
      
      if (readonly || !isMJ()) {
        const valueEl = document.createElement('p');
        valueEl.className = 'text-gray-200';
        if (isMultiline && typeof value === 'object') {
          valueEl.textContent = JSON.stringify(value, null, 2);
        } else {
          valueEl.textContent = String(value || 'N/A');
        }
        container.appendChild(valueEl);
      } else {
        const input = document.createElement(isLongText || isMultiline ? 'textarea' : 'input');
        input.className = 'bg-gray-700 text-gray-100 p-2 rounded border border-gray-600 focus:border-blue-500 focus:outline-none w-full min-h-[44px]';
        input.dataset.fieldKey = key;
        
        if (isMultiline) {
          input.value = typeof value === 'object' ? JSON.stringify(value, null, 2) : (value || '');
        } else {
          input.value = String(value || '');
        }
        
        input.addEventListener('change', () => {
          editingFields[key] = input.value;
        });
        
        container.appendChild(input);
      }
      
      return container;
    }

    // Close modal
    $('modal-close-btn').addEventListener('click', () => {
      $('system-modal').classList.add('hidden');
      currentSystem = null;
      editingFields = {};
    });

    // Listen for system selection
    map.on('systemSelected', async (system) => {
      currentSystem = system;
      editingFields = {};
      
      $('modal-title').textContent = system.nom || 'Système inconnu';
      $('modal-header-info').textContent = `Quadrant: ${esc(system.quadrant)}${isMJ() ? ' • Éditable' : ' • Lecture seule'}`;
      
      const content = $('modal-content');
      content.innerHTML = '';
      
      // Display fields
      const fields = [
        ['Nom', system.nom, 'nom', false],
        ['Faction', system.faction || 'N/A', 'faction', false],
        ['Gouvernement', system.gouvernement || '', 'gouvernement', false],
        ['Route commerciale', system.route || '', 'route', false],
        ['Description', system.description || '', 'description', false],
        ['Frontière', system.is_frontiere ? '⚠️ Zone frontière' : 'Non', 'is_frontiere', true]
      ];
      
      for (const [label, value, key, readonly] of fields) {
        content.appendChild(createFieldElement(label, value, key, readonly || !isMJ()));
      }
      
      // Action buttons
      const actions = $('modal-actions');
      actions.innerHTML = '';
      
      if (isMJ()) {
        const saveBtn = document.createElement('button');
        saveBtn.className = 'px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded min-h-[44px] font-medium transition-colors';
        saveBtn.textContent = 'Sauvegarder';
        saveBtn.addEventListener('click', async () => {
          if (document.body.classList.contains('mj-readonly')) {
            alert('Mode lecture seule hors ligne: action MJ temporairement indisponible.');
            return;
          }

          // Build update payload only with changed fields
          const updates = {};
          let hasErrors = false;
          
          // For each editable field, validate what user entered
          const fieldsToValidate = {
            nom: editingFields.nom !== undefined ? editingFields.nom : system.nom,
            gouvernement: editingFields.gouvernement !== undefined ? editingFields.gouvernement : system.gouvernement,
            route: editingFields.route !== undefined ? editingFields.route : system.route,
            description: editingFields.description !== undefined ? editingFields.description : system.description,
            faction: editingFields.faction !== undefined ? editingFields.faction : system.faction
          };
          
          const errors = validateSystemUpdate(fieldsToValidate);
          
          if (errors.length > 0) {
            alert('Erreur(s):\n' + errors.join('\n'));
            hasErrors = true;
          }
          
          if (hasErrors) return;
          
          // Only include fields that were actually changed
          Object.keys(editingFields).forEach(key => {
            if (editingFields[key] !== undefined && editingFields[key] !== system[key]) {
              updates[key] = editingFields[key];
            }
          });
          
          if (Object.keys(updates).length === 0) {
            alert('Aucune modification détectée.');
            return;
          }
          
          saveBtn.disabled = true;
          saveBtn.textContent = 'Sauvegarde...';
          
          const result = await saveSystemUpdate(system.id, updates);
          
          if (result.success) {
            alert('Système sauvegardé avec succès');
            currentSystem = result.system;
            // Optionally refresh the map
            map.emit('systemUpdated', result.system);
          } else {
            alert('Erreur: ' + result.error);
          }
          
          saveBtn.disabled = false;
          saveBtn.textContent = 'Sauvegarder';
        });
        
        actions.appendChild(saveBtn);
      }
      
      const closeBtn = document.createElement('button');
      closeBtn.className = 'px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded min-h-[44px] font-medium transition-colors';
      closeBtn.textContent = 'Fermer';
      closeBtn.addEventListener('click', () => $('system-modal').classList.add('hidden'));
      actions.appendChild(closeBtn);
      
      $('system-modal').classList.remove('hidden');
    });
