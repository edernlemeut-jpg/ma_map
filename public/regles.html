<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Adventures — Compendium de règles</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=2.0.0">
  <link rel="stylesheet" href="/css/ma-theme.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-gray-700 bg-gray-800">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold">
        <a href="/" class="hover:text-blue-400 transition-colors">⚙️ Metal Adventures</a>
      </h1>
      <nav class="flex items-center gap-4 text-sm">
        <span id="header-table-info" class="hidden flex items-center gap-2 text-gray-300 border-r border-gray-600 pr-4 mr-2">
          <span id="header-table-name" class="font-medium"></span>
          <span id="header-table-role" class="text-xs"></span>
          <a href="#" id="header-change-table"
             class="text-blue-400 hover:text-blue-300 text-xs ml-1" title="Changer de table">✕</a>
        </span>
        <span id="auth-user-info" class="hidden flex items-center gap-3">
          <span id="auth-user-name" class="text-gray-300"></span>
          <a href="#" id="auth-logout-btn"
             class="text-red-400 hover:text-red-300 hover:underline">Déconnexion</a>
        </span>
        <a href="/login.html" id="auth-login-link" class="text-blue-400 hover:underline">Connexion</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6">

    <!-- Title row -->
    <div class="flex items-center justify-between mb-4 gap-3 flex-wrap">
      <h2 class="text-lg font-semibold" style="color:var(--gold)">📖 Compendium de règles</h2>
      <div class="flex items-center gap-2">
        <button id="btn-add" class="hidden px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-lg flex items-center gap-1.5">
          ＋ Ajouter
        </button>
      </div>
    </div>

    <!-- Search bar -->
    <div class="mb-4 relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">🔍</span>
      <input id="search-input" type="text"
             class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-10 py-3 min-h-[44px] text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors"
             placeholder="Rechercher…" autocomplete="off">
      <button id="search-clear" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 min-w-[44px] min-h-[44px] flex items-center justify-center" title="Effacer">✕</button>
    </div>

    <!-- Category tabs -->
    <nav id="cat-nav" class="flex flex-wrap gap-1 border-b border-gray-700 mb-5">
      <button data-cat="all"         class="cat-btn active px-3 py-2 text-sm rounded-t-md min-h-[40px]">Tout</button>
      <button data-cat="competences" class="cat-btn px-3 py-2 text-sm rounded-t-md min-h-[40px]">Compétences</button>
      <button data-cat="qualites"    class="cat-btn px-3 py-2 text-sm rounded-t-md min-h-[40px]">Qualités</button>
      <button data-cat="defauts"     class="cat-btn px-3 py-2 text-sm rounded-t-md min-h-[40px]">Défauts</button>
      <button data-cat="mutations"   class="cat-btn px-3 py-2 text-sm rounded-t-md min-h-[40px]">Mutations</button>
      <button data-cat="actions"     class="cat-btn px-3 py-2 text-sm rounded-t-md min-h-[40px]">Actions</button>
    </nav>

    <!-- Loading -->
    <div id="loading" class="text-center py-12 text-gray-400">Chargement…</div>

    <!-- Layout: list + detail -->
    <div id="main-layout" class="hidden flex gap-4">
      <!-- Left: entry list -->
      <aside id="entry-list" class="w-64 flex-shrink-0 flex flex-col gap-1 overflow-y-auto max-h-[calc(100vh-280px)]">
        <!-- Cards injected here -->
      </aside>

      <!-- Right: entry detail -->
      <section id="entry-detail" class="flex-1 min-w-0 bg-gray-800 rounded-xl border border-gray-700 p-5 overflow-y-auto max-h-[calc(100vh-280px)]">
        <p id="detail-placeholder" class="text-gray-500 italic text-sm">Sélectionnez une entrée pour afficher ses détails.</p>
      </section>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16 text-gray-500 italic">Aucune entrée trouvée.</div>

    <!-- Error state -->
    <div id="error-state" class="hidden text-center py-12">
      <p class="text-red-400">Erreur de chargement. <button id="retry-btn" class="text-blue-400 hover:underline">Réessayer</button></p>
    </div>
  </main>

  <!-- Modal: view / edit -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div id="modal-box" class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-2xl">
      <button id="modal-close" class="absolute top-3 right-3 text-gray-400 hover:text-gray-200 text-2xl leading-none">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/shared/cold-start.js?v=2.0.2"></script>
  <script type="module" src="/js/regles/regles-app.js?v=1.0.0"></script>
</body>
</html>
