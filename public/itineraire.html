<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carte Galactique — Metal Adventures</title>
  <style>
    :root { --gold:#c8a464; --bg:#1a1a1a; --bg2:#2c2c2c; --bg3:#383838; --border:#444; --text:#e0e0e0; --text-light:#f1f1f1; --primary:#5bc0de; --danger:#d9534f; --success:#5cb85c; --warning:#f0ad4e; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; padding:0; background:var(--bg); color:var(--text); font-family:sans-serif; overflow:hidden; }
    #app-header { height:48px; background:var(--bg2); border-bottom:2px solid var(--gold); display:flex; align-items:center; justify-content:space-between; padding:0 12px; position:fixed; top:0; left:0; right:0; z-index:50; gap:8px; }
    #app-header h1 { color:var(--gold); font-size:1.1rem; margin:0; flex-shrink:0; }
    #app-header .header-actions { display:flex; gap:6px; align-items:center; min-width:0; overflow:hidden; }
    #app-header button, #app-header a.hbtn { background:var(--bg3); border:1px solid var(--border); color:var(--text-light); padding:6px 10px; border-radius:4px; cursor:pointer; font-size:0.9rem; text-decoration:none; display:inline-block; white-space:nowrap; }
    #app-header button:hover, #app-header a.hbtn:hover { border-color:var(--gold); }
    #ship-select { background:var(--bg3); border:1px solid var(--border); color:var(--text-light); padding:5px 6px; border-radius:4px; font-size:0.78rem; max-width:140px; cursor:pointer; }
    #ship-select:hover { border-color:var(--gold); }
    #auth-user-info { display:none; align-items:center; gap:6px; font-size:0.8rem; }
    #auth-user-name { color:#bbb; }
    #auth-logout-btn { color:var(--danger); cursor:pointer; font-size:0.8rem; background:none; border:none; white-space:nowrap; }
    #auth-login-link { color:var(--primary); font-size:0.8rem; text-decoration:none; white-space:nowrap; }
    .hidden { display:none!important; }
    #main-layout { position:fixed; top:48px; left:0; right:0; bottom:0; display:flex; flex-direction:column; }
    #carte-zone { flex:1; overflow:hidden; position:relative; touch-action:none; background:#111; cursor:grab; }
    #carte-zone.grabbing { cursor:grabbing; }
    #carte-zone.picking { cursor:crosshair; }
    #carte-zone.picking .quad:hover { outline:2px solid var(--gold); z-index:1; }
    #carte-zone.picking::after { content:'🎯 Cliquez sur un quadrant'; position:absolute; top:8px; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; padding:4px 14px; border-radius:20px; font-size:0.78rem; font-weight:bold; z-index:100; pointer-events:none; white-space:nowrap; }
    #carte-wrapper { position:absolute; transform-origin:0 0; display:inline-flex; flex-direction:column; }
    #col-legende { display:grid; grid-template-columns:20px repeat(40,20px); height:20px; }
    #ligne-wrapper { display:flex; }
    #row-legende { display:grid; grid-template-rows:repeat(40,20px); width:20px; }
    .col-header,.row-header { font-size:0.6rem; color:#666; text-align:center; display:flex; align-items:center; justify-content:center; }
    .row-header { justify-content:flex-end; padding-right:2px; }
    #carte { display:grid; grid-template-columns:repeat(40,20px); grid-template-rows:repeat(40,20px); background:url('/carte_MA.png') 0 0/800px 800px no-repeat; }
    .quad { width:20px; height:20px; background:rgba(200,164,100,0.07); border:1px solid rgba(200,164,100,0.15); cursor:pointer; }
    .quad:hover { background:rgba(200,164,100,0.4); }
    .quad.has-system { background:rgba(91,192,222,0.25); border-color:rgba(91,192,222,0.5); }
    .quad.selected-dep { background:rgba(217,83,79,0.7)!important; border-color:var(--danger)!important; }
    .quad.selected-arr { background:rgba(92,184,92,0.7)!important; border-color:var(--success)!important; }
    .quad.selected-eta { background:rgba(255,165,0,0.7)!important; border-color:var(--warning)!important; }
    .quad.path { background:rgba(240,173,78,0.3); border-color:var(--warning); }
    #bottom-sheet { position:absolute; bottom:0; left:0; right:0; background:var(--bg2); border-top:2px solid var(--gold); max-height:55vh; overflow-y:auto; transform:translateY(100%); transition:transform 0.3s ease; z-index:20; border-radius:12px 12px 0 0; }
    #bottom-sheet.open { transform:translateY(0); }
    #bottom-sheet-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:8px auto; cursor:pointer; }
    #bottom-sheet-title { display:flex; justify-content:space-between; align-items:center; color:var(--gold); font-weight:bold; padding:0 12px 4px; font-size:0.95rem; }
    #bottom-sheet-content { padding:0 16px 16px; }
    .btn-point { padding:6px 10px; border-radius:4px; border:2px solid; font-size:0.8rem; font-weight:bold; cursor:pointer; background:transparent; }
    .btn-dep { border-color:var(--danger); color:var(--danger); }
    .btn-dep:hover { background:var(--danger); color:white; }
    .btn-eta { border-color:var(--warning); color:var(--warning); }
    .btn-eta:hover { background:var(--warning); color:#111; }
    .btn-arr { border-color:var(--success); color:var(--success); }
    .btn-arr:hover { background:var(--success); color:white; }
    #fab-calculer { position:absolute; bottom:12px; right:12px; z-index:30; background:var(--success); color:white; border:none; border-radius:28px; padding:14px 20px; font-size:1rem; font-weight:bold; box-shadow:0 4px 16px rgba(0,0,0,0.5); cursor:pointer; display:flex; align-items:center; gap:8px; transition:bottom 0.3s; }
    #fab-calculer.sheet-open { bottom:calc(55vh + 12px); }
    #result-panel { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:100; transform:translateY(100%); transition:transform 0.35s ease; display:flex; flex-direction:column; }
    #result-panel.open { transform:translateY(0); }
    #result-panel.minimized { transform:translateY(calc(100% - 52px)); cursor:pointer; }
    #result-panel.minimized #result-body { pointer-events:none; }
    #result-header { background:var(--bg2); border-bottom:2px solid var(--gold); padding:12px 16px; display:flex; align-items:center; gap:12px; flex-shrink:0; height:52px; }
    #result-header h2 { color:var(--gold); margin:0; font-size:1.1rem; flex-grow:1; }
    #btn-close-result { background:none; border:none; color:var(--text-light); font-size:1.8rem; cursor:pointer; padding:0; }
    #btn-minimize-result { background:none; border:1px solid var(--border); color:var(--text-light); font-size:0.9rem; cursor:pointer; padding:2px 8px; border-radius:4px; transition:transform 0.3s; flex-shrink:0; }
    #result-panel.minimized #btn-minimize-result { transform:rotate(180deg); }
    #result-body { flex:1; overflow-y:auto; padding:12px 16px 24px; }
    .result-summary { background:#111; border-radius:8px; padding:12px; margin-bottom:16px; text-align:center; font-size:0.9rem; border:1px solid var(--border); line-height:1.9; }
    .result-leg { border-left:4px solid var(--primary); margin-bottom:16px; background:var(--bg2); border-radius:0 8px 8px 0; }
    .result-leg-header { padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none; }
    .result-leg-header h3 { color:var(--primary); margin:0; font-size:0.9rem; }
    .leg-info { font-size:0.78rem; color:#aaa; margin-top:2px; }
    .result-leg-body { padding:0 14px 14px; }
    .result-leg.collapsed .result-leg-body { display:none; }
    .result-leg.collapsed .caret { transform:rotate(-90deg); }
    .caret { transition:transform 0.2s; display:inline-block; }
    .trip-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    .trip-table th,.trip-table td { border:1px solid var(--border); padding:4px 5px; text-align:center; }
    .trip-table th { background:var(--bg3); color:#bbb; font-size:0.75rem; }
    .trip-table input[type=number] { width:50px; padding:2px 4px; text-align:center; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:3px; }
    .peril-link { color:var(--gold); cursor:pointer; text-decoration:underline; font-size:0.82rem; }
    .status-ok { color:var(--success); }
    .status-done { color:var(--primary); font-weight:bold; }
    .btn-action { width:100%; padding:11px; border:none; border-radius:8px; font-size:0.95rem; font-weight:bold; cursor:pointer; margin-top:8px; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-gold { background:var(--bg3); color:var(--gold); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
    .modal-backdrop.open { opacity:1; pointer-events:all; }
    .modal-sheet { background:var(--bg2); width:100%; max-width:640px; max-height:90vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:16px; transform:translateY(100%); transition:transform 0.3s ease; }
    .modal-backdrop.open .modal-sheet { transform:translateY(0); }
    .modal-title { color:var(--gold); font-weight:bold; font-size:1rem; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .modal-close { background:none; border:none; color:var(--text-light); font-size:1.5rem; cursor:pointer; }
    .params-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .param-field label { font-size:0.8rem; color:#bbb; display:block; margin-bottom:4px; }
    .param-field input { width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:4px; font-size:0.95rem; }
    .peril-sheet h2 { color:var(--gold); margin:0 0 8px; }
    .pstats { font-size:0.8rem; color:#bbb; margin-bottom:8px; }
    .psection { background:var(--bg3); border-radius:6px; padding:8px 12px; margin-top:8px; }
    .psection-title { font-size:0.78rem; font-weight:bold; color:#888; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
    .desc { font-style:italic; color:#ccc; font-size:0.85rem; line-height:1.5; margin:0; }
    .detail-section { border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; }
    .detail-section-hdr { background:var(--bg3); padding:9px 12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none; }
    .detail-section-hdr h3 { margin:0; font-size:0.88rem; color:var(--gold); }
    .detail-section-body { padding:10px 12px; }
    .detail-section.collapsed .detail-section-body { display:none; }
    .detail-section.collapsed .d-caret { transform:rotate(-90deg); }
    .d-caret { transition:transform 0.2s; display:inline-block; font-size:0.7rem; color:#aaa; }
    .detail-stats { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin-bottom:6px; }
    .detail-stat { font-size:0.8rem; line-height:1.4; }
    .detail-stat strong { color:#bbb; font-weight:normal; }
    .detail-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.72rem; font-weight:bold; margin:2px 2px 2px 0; }
    .badge-atmos { background:#1e3a4a; color:#7dd3fc; }
    .badge-grav { background:#2d2a1e; color:#fcd34d; }
    .badge-sec { background:#1e2d1e; color:#86efac; }
    .badge-com { background:#2d1e2d; color:#d8b4fe; }
    .detail-desc { font-style:italic; color:#ccc; font-size:0.82rem; line-height:1.5; margin:6px 0 0; }
    .detail-list { margin:4px 0 0 16px; padding:0; font-size:0.8rem; color:#ccc; }
    .detail-list li { margin-bottom:2px; }
    .detail-merch { font-size:0.8rem; color:#bbb; margin-top:6px; }
    .historique-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; background:var(--bg3); }
    .hinfo { flex:1; }
    .hinfo strong { display:block; font-size:0.88rem; }
    .hinfo small { color:#888; font-size:0.75rem; }
    .hactions { display:flex; gap:6px; }
    .btn-hist-load { background:var(--primary); color:white; border:none; border-radius:4px; padding:5px 10px; cursor:pointer; font-size:0.8rem; }
    .btn-hist-del { background:var(--danger); color:white; border:none; border-radius:4px; padding:5px 10px; cursor:pointer; font-size:0.8rem; }
    .admin-tabs { display:flex; gap:0; margin-bottom:12px; border-bottom:2px solid var(--border); }
    .admin-tab { padding:8px 14px; background:none; border:none; color:#888; cursor:pointer; font-size:0.82rem; font-weight:bold; border-bottom:2px solid transparent; margin-bottom:-2px; }
    .admin-tab.active { color:var(--gold); border-bottom-color:var(--gold); }
    .admin-tab:hover { color:var(--text-light); }
    .admin-tab-content { display:none; }
    .admin-tab-content.active { display:block; }
    .admin-table-item { display:flex; align-items:center; justify-content:space-between; background:var(--bg3); padding:8px 12px; border-radius:6px; margin-bottom:6px; gap:8px; }
    .admin-table-item .atname { flex:1; font-size:0.88rem; }
    .admin-table-item .attype { font-size:0.72rem; padding:2px 8px; border-radius:10px; flex-shrink:0; }
    .admin-table-item .attype.ip { background:#1e3a4a; color:#7dd3fc; }
    .admin-table-item .attype.hs { background:#2d1e2d; color:#d8b4fe; }
    .admin-table-item .at-actions { display:flex; gap:4px; flex-shrink:0; }
    .admin-table-item .at-actions button { padding:4px 8px; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:3px; cursor:pointer; font-size:0.75rem; }
    .admin-table-item .at-actions button:hover { border-color:var(--gold); }
    .admin-table-item .at-actions .btn-del { color:var(--danger); }
    .btn-add-table { display:flex; gap:6px; margin-bottom:10px; }
    .btn-add-table button { flex:1; padding:6px; background:var(--bg3); border:1px dashed var(--border); color:var(--primary); border-radius:4px; cursor:pointer; font-size:0.8rem; }
    .peril-edit-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .peril-edit-header button { padding:5px 10px; background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:4px; cursor:pointer; font-size:0.8rem; }
    .peril-edit-header input { flex:1; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:3px; font-size:0.88rem; }
    .peril-edit-cat { border:1px solid var(--border); border-radius:6px; margin-bottom:8px; overflow:hidden; }
    .peril-edit-cat-hdr { background:var(--bg3); padding:8px 12px; cursor:pointer; display:flex; justify-content:space-between; font-size:0.82rem; font-weight:bold; color:var(--gold); user-select:none; }
    .peril-edit-cat-body { display:none; padding:8px; }
    .peril-edit-cat.open .peril-edit-cat-body { display:block; }
    .peril-edit-item { border:1px solid var(--border); border-radius:4px; margin-bottom:6px; }
    .peril-edit-item-hdr { background:var(--bg2); padding:6px 10px; cursor:pointer; display:flex; justify-content:space-between; font-size:0.8rem; user-select:none; }
    .pe-nom { font-weight:bold; color:var(--text-light); }
    .pe-range { color:#888; font-size:0.75rem; }
    .peril-edit-fields { display:none; padding:8px; }
    .peril-edit-item.open .peril-edit-fields { display:block; }
    .pe-field { margin-bottom:6px; }
    .pe-field label { font-size:0.72rem; color:#888; display:block; margin-bottom:2px; }
    .pe-field input,.pe-field textarea { width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:5px 8px; border-radius:3px; font-size:0.82rem; font-family:inherit; resize:vertical; }
    .pe-field textarea { min-height:60px; }
    .pe-field-row { display:flex; gap:6px; margin-bottom:6px; }
    .pe-field-row .pe-field { flex:1; margin-bottom:0; }
    .pe-field-check { display:flex; align-items:center; }
    .pe-field-check label { font-size:0.78rem; color:#bbb; display:flex; align-items:center; gap:4px; cursor:pointer; }
    .assign-row { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--border); border-radius:4px; margin-bottom:5px; background:var(--bg3); }
    .ar-coord { font-size:0.78rem; font-weight:bold; color:var(--gold); white-space:nowrap; min-width:55px; }
    .ar-label { flex:1; font-size:0.78rem; color:#aaa; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .assign-row select { background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:3px 6px; border-radius:3px; font-size:0.78rem; }
    .faction-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:4px; margin-bottom:6px; }
    .faction-item img { width:32px; height:32px; border-radius:4px; object-fit:cover; flex-shrink:0; }
    .faction-item .fi-info { flex:1; min-width:0; }
    .faction-item .fi-name { font-weight:bold; color:var(--gold); font-size:0.85rem; }
    .faction-item .fi-desc { font-size:0.72rem; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .faction-picker { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
    .faction-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border:1px solid var(--border); border-radius:12px; cursor:pointer; font-size:0.78rem; background:var(--bg2); color:var(--text); }
    .faction-chip:hover { border-color:var(--gold); }
    .faction-chip.active { border-color:var(--primary); background:var(--primary); color:white; }
    .faction-chip img { width:18px; height:18px; border-radius:3px; object-fit:cover; }
    .se-field { display:flex; flex-direction:column; }
    .se-field label { font-size:0.75rem; color:#aaa; margin-bottom:3px; }
    .se-field input,.se-field select,.se-field textarea { background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:3px; font-size:0.85rem; font-family:inherit; }
    .se-field textarea { resize:vertical; min-height:60px; }
    .se-field.full { grid-column:1/-1; }
    .se-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .se-grid.g3 { grid-template-columns:1fr 1fr 1fr; }
    .se-fieldset { grid-column:1/-1; border:1px solid var(--border); border-radius:4px; padding:8px; margin:0; }
    .se-fieldset legend { font-size:0.75rem; color:#888; padding:0 4px; }
    .se-list-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
    .se-list-row input,.se-list-row select { flex:1; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:4px 6px; border-radius:3px; font-size:0.8rem; }
    .se-btn-add { display:block; width:100%; padding:5px; border:1px dashed var(--border); background:none; color:var(--primary); border-radius:4px; cursor:pointer; font-size:0.78rem; margin-top:4px; }
    .se-btn-del { background:var(--danger); color:white; border:none; border-radius:3px; cursor:pointer; padding:3px 6px; font-size:0.72rem; flex-shrink:0; }
    .se-btn-del:hover { opacity:0.8; }
    .se-actions { display:flex; gap:6px; margin-top:6px; }
    .se-actions button { flex:1; padding:6px; border-radius:4px; cursor:pointer; font-size:0.82rem; border:none; }
    .sys-header-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .sys-header-fields .se-field.full { grid-column:1/-1; }
    .sys-edit-card { border:1px solid var(--border); border-radius:6px; margin-bottom:8px; overflow:hidden; }
    .sys-card-hdr { background:var(--bg3); padding:8px 12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none; }
    .sys-card-hdr h4 { margin:0; font-size:0.85rem; color:var(--gold); }
    .sys-card-hdr input { background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:3px 7px; border-radius:3px; font-size:0.85rem; flex:1; margin-right:8px; }
    .se-caret { font-size:0.7rem; color:#aaa; transition:transform 0.2s; display:inline-block; }
    .sys-edit-card.collapsed .se-caret { transform:rotate(-90deg); }
    .sys-card-body { padding:10px; }
    .sys-edit-card.collapsed .sys-card-body { display:none; }
    .card-planet { border-left:3px solid var(--primary); }
    .card-moon { border-left:3px solid #888; margin-left:16px; }
    .card-sun { border-left:3px solid var(--gold); }
    .card-patrol { border-left:3px solid var(--warning); }
    .card-system { border-left:3px solid #666; }
    .pt-row { display:flex; align-items:center; gap:4px; padding:4px 6px; border:1px solid var(--border); border-radius:4px; margin-bottom:4px; background:var(--bg3); }
    .pt-role { font-size:0.7rem; font-weight:bold; min-width:28px; flex-shrink:0; }
    .pt-label { flex:1; font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pt-move { background:none; border:1px solid var(--border); color:#888; cursor:pointer; padding:1px 5px; font-size:0.7rem; border-radius:3px; }
    .pt-move:disabled { opacity:0.3; }
    .pt-del { background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem; padding:0 3px; }
    .point-badge { padding:4px 10px; border-radius:12px; font-size:0.8rem; font-weight:bold; border:1px solid; }
    .point-badge.dep { border-color:var(--danger); color:var(--danger); }
    .point-badge.eta { border-color:var(--warning); color:var(--warning); }
    .point-badge.arr { border-color:var(--success); color:var(--success); }
    #points-summary { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
    @media (min-width:768px) {
      #main-layout { flex-direction:row; }
      #carte-zone { flex:7; }
      #desktop-panel { flex:3; min-width:300px; max-width:400px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
      #desktop-panel-content { flex:1; overflow-y:auto; padding:12px; }
      #bottom-sheet { display:none!important; }
      #fab-calculer { display:none!important; }
      #result-panel { display:none!important; }
      .dp-section { margin-bottom:14px; }
      .dp-section-title { font-size:0.72rem; font-weight:bold; color:#888; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid var(--border); }
      .btn-action { font-size:0.88rem; padding:9px; }
    }
    @media (max-width:767px) { #desktop-panel { display:none; } }
  </style>
</head>
<body>
  <header id="app-header">
    <h1>⚡ Metal Adventures</h1>
    <div class="header-actions">
      <a href="/index.html" class="hbtn">← Accueil</a>
      <select id="ship-select" title="Vaisseau actif">
        <option value="">🚀 Vaisseau...</option>
      </select>
      <span id="auth-user-info" class="hidden">
        <span id="auth-user-name"></span>
        <button id="auth-logout-btn">Déco</button>
      </span>
      <a href="/login.html" id="auth-login-link">Connexion</a>
      <button id="btn-params" title="Paramètres">⚙</button>
      <button id="btn-historique" title="Historique">📋</button>
      <button id="btn-admin" title="Administration">≡</button>
    </div>
  </header>

  <div id="main-layout">
    <div id="carte-zone">
      <div id="carte-wrapper">
        <div id="col-legende"></div>
        <div id="ligne-wrapper">
          <div id="row-legende"></div>
          <div id="carte"></div>
        </div>
      </div>
    </div>

    <div id="bottom-sheet">
      <div id="bottom-sheet-handle"></div>
      <div id="bottom-sheet-title"><span id="bs-title-text">—</span><div id="bs-quad-btns" style="display:flex;gap:4px"></div></div>
      <div id="bs-trip-state"></div>
      <div id="bottom-sheet-content"></div>
    </div>

    <button id="fab-calculer">🚀 Calculer</button>

    <div id="desktop-panel">
      <div id="desktop-panel-content">
        <div class="dp-section">
          <div class="dp-section-title">Quadrant sélectionné</div>
          <div id="dp-quad-info" style="font-size:0.85rem;color:#aaa;padding:6px;background:var(--bg3);border-radius:4px;min-height:50px;">Tapez sur un quadrant.</div>
        </div>
        <div class="dp-section">
          <div class="dp-section-title">Itinéraire</div>
          <div id="dp-points" style="font-size:0.82rem;margin-bottom:8px;min-height:30px;color:#aaa;line-height:1.8;">Aucun point.</div>
          <button id="btn-calc-desktop" class="btn-action btn-primary" style="display:none">🚀 Calculer</button>
        </div>
        <div class="dp-section" id="dp-result-section" style="display:none">
          <div class="dp-section-title">Résultat</div>
          <div id="dp-summary" class="result-summary" style="font-size:0.82rem;margin-bottom:10px;"></div>
          <div id="dp-legs"></div>
          <button class="btn-action btn-primary" id="btn-update-desktop">Actualiser</button>
          <button class="btn-action btn-gold" style="border:1px solid var(--gold)" id="btn-save-hist-desktop">💾 Sauvegarder</button>
        </div>
      </div>
    </div>
  </div>

  <div id="result-panel">
    <div id="result-header">
      <button id="btn-close-result">←</button>
      <h2>Rapport de Voyage</h2>
      <button id="btn-minimize-result" title="Réduire">▼</button>
    </div>
    <div id="result-body">
      <div id="points-summary"></div>
      <div id="mob-summary" class="result-summary"></div>
      <div id="mob-legs"></div>
      <button class="btn-action btn-primary" id="btn-update-mobile">Actualiser</button>
      <button class="btn-action btn-gold" style="border:1px solid var(--gold)" id="btn-save-hist-mobile">💾 Sauvegarder</button>
    </div>
  </div>

  <!-- Modal Paramètres -->
  <div id="modal-params" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">⚙ Paramètres <button class="modal-close" data-modal="modal-params">✕</button></div>
      <div id="params-ship-info" style="padding:8px;background:var(--bg3);border-radius:4px;font-size:0.8rem;color:#bbb;margin-bottom:10px;display:none"></div>
      <div class="params-grid">
        <div class="param-field"><label>Vitesse interplanétaire (US/j)</label><input type="number" id="p-ip-spd" value="100" min="1"></div>
        <div class="param-field"><label>Vitesse hyperspace (PC/j)</label><input type="number" id="p-hs-spd" value="1000" min="1"></div>
        <div class="param-field"><label>Autonomie (PC)</label><input type="number" id="p-hs-auto" value="10000" min="0"></div>
      </div>
      <button id="btn-save-params" class="btn-action btn-primary" style="margin-top:14px">Enregistrer</button>
    </div>
  </div>

  <!-- Modal Péril -->
  <div id="modal-peril" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">Péril <button class="modal-close" data-modal="modal-peril">✕</button></div>
      <div id="peril-content" class="peril-sheet"></div>
    </div>
  </div>

  <!-- Modal Historique -->
  <div id="modal-historique" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">📋 Historique <button class="modal-close" data-modal="modal-historique">✕</button></div>
      <div id="hist-list"></div>
      <div id="hist-empty" style="text-align:center;color:#888;padding:20px;display:none">Aucun itinéraire sauvegardé.</div>
    </div>
  </div>

  <!-- Modal Admin -->
  <div id="modal-admin" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title">≡ Administration <button class="modal-close" data-modal="modal-admin">✕</button></div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="tab-perils">Périls</button>
        <button class="admin-tab" data-tab="tab-factions">Factions</button>
        <button class="admin-tab" data-tab="tab-systemes">Systèmes</button>
        <button class="admin-tab" data-tab="tab-quadrants">Quadrants</button>
      </div>
      <div id="tab-perils" class="admin-tab-content active"></div>
      <div id="tab-factions" class="admin-tab-content"></div>
      <div id="tab-systemes" class="admin-tab-content"></div>
      <div id="tab-quadrants" class="admin-tab-content"></div>
      <div style="padding:12px 0 0;border-top:1px solid var(--border);margin-top:12px">
        <a href="/vaisseaux.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:0.88rem;text-decoration:none;">🛸 Gérer les vaisseaux →</a>
      </div>
    </div>
  </div>

  <!-- Modal Détail système -->
  <div id="modal-detail" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-title"><span id="modal-detail-title">Système</span><button class="modal-close" data-modal="modal-detail">✕</button></div>
      <div id="detail-content" class="peril-sheet"></div>
    </div>
  </div>

  <!-- Modal Édition système -->
  <div id="modal-edit-system" class="modal-backdrop">
    <div class="modal-sheet" style="max-width:720px">
      <div class="modal-title"><span id="edit-sys-title">Éditer Système</span><button class="modal-close" data-modal="modal-edit-system">✕</button></div>
      <div id="edit-sys-content"></div>
    </div>
  </div>

  <!-- Modal Faction -->
  <div id="modal-faction" class="modal-backdrop">
    <div class="modal-sheet" style="max-width:420px">
      <div class="modal-title"><span id="faction-modal-title">Nouvelle Faction</span><button class="modal-close" data-modal="modal-faction">✕</button></div>
      <div style="padding:10px">
        <div class="se-field" style="margin-bottom:8px"><label>Nom</label><input type="text" id="faction-name" style="width:100%"></div>
        <div class="se-field" style="margin-bottom:8px"><label>Diminutif</label><input type="text" id="faction-short" placeholder="ex: EG, LPL…" style="width:100%"></div>
        <div class="se-field" style="margin-bottom:8px"><label>Description</label><textarea id="faction-desc" rows="3" style="width:100%;font-family:inherit"></textarea></div>
        <div class="se-field" style="margin-bottom:8px"><label>Icône (image)</label>
          <div style="display:flex;align-items:center;gap:8px">
            <img id="faction-icon-preview" src="" style="width:40px;height:40px;border-radius:4px;object-fit:cover;border:1px solid var(--border);display:none">
            <input type="file" id="faction-icon-input" accept="image/*" style="font-size:0.78rem;color:var(--text)">
          </div>
        </div>
        <input type="hidden" id="faction-icon-data">
        <input type="hidden" id="faction-edit-id">
        <div style="display:flex;gap:8px;margin-top:12px">
          <button id="btn-save-faction" style="flex:1;padding:8px;background:var(--primary);color:white;border:none;border-radius:4px;cursor:pointer">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/shared/cold-start.js?v=2.0.0"></script>
  <script type="module" src="/js/itineraire.js?v=2.0.0"></script>
</body>
</html>
