<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combat Spatial — Metal Adventures</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=2.0.0">
  <link rel="stylesheet" href="/css/ma-theme.css">
  <style>
    /* Scrollbars fines */
    #combat-list::-webkit-scrollbar,
    #ship-list::-webkit-scrollbar,
    #right-panel::-webkit-scrollbar { width: 4px; }
    #combat-list::-webkit-scrollbar-track,
    #ship-list::-webkit-scrollbar-track,
    #right-panel::-webkit-scrollbar-track { background: transparent; }
    #combat-list::-webkit-scrollbar-thumb,
    #ship-list::-webkit-scrollbar-thumb,
    #right-panel::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }

    .btn-primary { background: #92400e; color: #fef3c7; font-weight: 500; }
    .btn-primary:hover { background: #b45309; }

    /* SVG container */
    #radar-container {
      background: #070907;
      border: 1px solid #1e3014;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    /* Bouton retour mobile (caché sur desktop) */
    .mobile-back { display: none; }

    /* ── Responsive mobile ─────────────────────────────────────── */
    @media (max-width: 767px) {
      main.flex { flex-direction: column !important; height: auto !important; overflow: visible !important; }

      /* Sidebar : pleine largeur */
      #combat-sidebar {
        width: 100% !important;
        border-right: none !important;
        border-bottom: 1px solid #374151;
        max-height: 45vh;
      }
      /* Panel détail caché par défaut */
      #right-panel { display: none !important; }

      /* Détail ouvert */
      body.detail-open #combat-sidebar { display: none !important; }
      body.detail-open #right-panel { display: flex !important; flex-direction: column; min-height: 100dvh; }

      /* Bouton retour visible */
      .mobile-back { display: inline-flex !important; align-items: center; gap: 0.4rem; }

      /* Vaisseaux en bas sur mobile */
      #panel-combat > .flex { flex-direction: column !important; overflow: visible !important; }
      #panel-combat > .flex > aside {
        width: 100% !important;
        border-left: none !important;
        border-top: 1px solid #374151;
        max-height: 200px;
      }

      /* Journal plein-largeur */
      #journal-panel { max-height: none; }
      #journal-list { max-height: 250px; }
    }

    /* Sélection combat */
    #combat-list button.ring-1 { background: rgba(245, 158, 11, 0.05); }

    /* Empêcher select over SVG labels */
    .combat-radar-svg text { user-select: none; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header commun -->
  <header class="border-b border-gray-700 bg-gray-800 flex-shrink-0">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/"><img src="/images/logo.png" alt="Metal Adventures" class="ma-logo-img"></a>
        <span style="color:var(--border)">|</span>
        <h1 class="font-bold flex items-center gap-2" style="color:var(--gold);font-family:'Rajdhani',sans-serif;font-weight:700;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="width:18px;height:18px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/></svg> Combat Spatial</h1>
        <span class="text-xs" style="color:var(--text-muted)">Metal Adventures</span>
      </div>
      <nav class="flex items-center gap-4 text-sm">
        <span id="header-table-info" class="hidden flex items-center gap-2 text-gray-300 border-r border-gray-600 pr-4 mr-2">
          <span id="header-table-name" class="font-medium"></span>
          <span id="header-table-role" class="text-xs"></span>
          <a href="#" id="header-change-table" class="text-blue-400 hover:text-blue-300 text-xs ml-1" title="Changer de table">✕</a>
        </span>
        <span id="auth-user-info" class="hidden flex items-center gap-3">
          <span id="auth-user-name" class="text-gray-300"></span>
          <a href="#" id="auth-logout-btn" class="text-red-400 hover:text-red-300 hover:underline">Déconnexion</a>
        </span>
        <a href="/login.html" id="auth-login-link" class="text-blue-400 hover:underline">Connexion</a>
      </nav>
    </div>
  </header>

  <!-- Contenu principal : layout 2 colonnes -->
  <main class="flex-1 flex overflow-hidden" style="height: calc(100vh - 57px);">

    <!-- Colonne gauche : liste des combats -->
    <aside id="combat-sidebar" class="w-72 flex-shrink-0 border-r border-gray-700 flex flex-col bg-gray-850">
      <div class="p-4 border-b border-gray-700 flex items-center justify-between">
        <h2 class="font-semibold text-sm text-gray-200">Combats</h2>
        <button id="btn-new-combat" class="text-xs px-3 py-1.5 rounded btn-primary hidden">+ Nouveau</button>
      </div>
      <div id="combat-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        <p class="text-gray-500 text-sm text-center py-8">Chargement…</p>
      </div>
    </aside>

    <!-- Colonne droite -->
    <section id="right-panel" class="flex-1 overflow-y-auto flex flex-col">

      <!-- État vide -->
      <div id="panel-empty" class="flex flex-col items-center justify-center flex-1 text-gray-500 gap-4 py-20">
        <span class="text-5xl">🚀</span>
        <p class="text-center">Sélectionnez un combat dans la liste<br>ou créez-en un nouveau (MJ).</p>
      </div>

      <!-- Panneau combat actif -->
      <div id="panel-combat" class="hidden flex-col flex-1">

        <!-- En-tête combat -->
        <div class="border-b border-gray-700 p-4">
          <button class="mobile-back mb-2 text-sm text-blue-400 hover:text-blue-300" onclick="document.body.classList.remove('detail-open')">&#8592; Combats</button>
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h2 id="combat-title" class="font-bold text-lg text-gray-100">—</h2>
              <div class="flex items-center gap-3 mt-1 flex-wrap">
                <span id="combat-phase-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-800 text-blue-200">Approche</span>
                <span class="text-xs text-gray-500">Config : <span id="combat-config" class="text-gray-300">—</span></span>
                <span class="text-xs text-gray-500">Champ : <span id="combat-champ" class="text-gray-300">—</span></span>
              </div>
            </div>
            <div id="mj-controls" class="flex-shrink-0"></div>
          </div>
        </div>

        <!-- Corps phase-first : contenu injecté par _renderPhaseBody() -->
        <div id="avantage-banner" class="hidden border-b border-gray-700 px-4 py-2 flex items-center gap-4 flex-wrap" style="background:rgba(200,148,58,0.06);">
          <span class="text-xs font-semibold uppercase tracking-wide flex-shrink-0" style="color:var(--gold)">Avantage :</span>
          <div id="avantage-banner-ships" class="flex items-center gap-4 flex-wrap"></div>
        </div>
        <div id="phase-body" class="flex flex-1 overflow-hidden"></div>

        <!-- Journal de combat -->
        <section id="journal-panel" class="hidden border-t border-gray-700 p-4 space-y-2">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Journal de combat</h3>
          <ul id="journal-list" class="space-y-1.5 max-h-48 overflow-y-auto"></ul>
        </section>

      </div>

    </section>
  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════════
       MODAL — Nouveau combat
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="combat-modal" class="fixed inset-0 bg-black/70 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-xl shadow-2xl w-full max-w-lg border border-gray-600">

      <div class="p-5 border-b border-gray-700 flex items-center justify-between">
        <h2 id="modal-title" class="font-semibold text-lg">Nouveau combat spatial</h2>
        <button id="modal-close" class="text-gray-400 hover:text-white text-xl leading-none">×</button>
      </div>

      <form id="form-new-combat" class="p-5 space-y-4">

        <div>
          <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Nom du combat *</label>
          <input id="modal-nom" type="text" maxlength="120" required
            class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500"
            placeholder="Ex : Embuscade autour de Kepler-III">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Configuration</label>
            <select id="modal-configuration"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500">
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Champ de bataille</label>
            <select id="modal-champ"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500">
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Notes MJ</label>
          <textarea id="modal-notes" rows="2"
            class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500 resize-none"
            placeholder="Contexte, enjeux…"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="modal-cancel"
            class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200"
            onclick="document.getElementById('combat-modal').classList.add('hidden')">Annuler</button>
          <button type="submit"
            class="px-4 py-2 text-sm rounded btn-primary">Créer le combat</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════════
       MODAL — Ajouter / éditer vaisseau
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="ship-modal" class="fixed inset-0 bg-black/70 z-40 hidden flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-xl shadow-2xl w-full max-w-lg border border-gray-600">

      <div class="p-5 border-b border-gray-700 flex items-center justify-between">
        <h2 id="modal-ship-title" class="font-semibold text-lg">Vaisseau</h2>
        <button id="modal-ship-close" class="text-gray-400 hover:text-white text-xl leading-none">×</button>
      </div>

      <form id="form-ship" class="p-5 space-y-4">

        <!-- Sélection depuis la flotte (mode ajout uniquement) -->
        <div id="fleet-select-section" class="hidden">
          <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Vaisseau *</label>
          <select id="ship-fleet-select" required
            class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-gray-200">
            <option value="">— Sélectionner un vaisseau —</option>
          </select>
          <!-- Aperçu stats du vaisseau sélectionné -->
          <div id="fleet-ship-preview" class="hidden mt-2 px-3 py-2 rounded text-xs" style="background:var(--bg2);border:1px solid var(--border)">
            <span id="preview-classe" class="font-medium mr-3"></span><span id="preview-coque" class="text-gray-400 mr-3"></span><span id="preview-senseurs" class="text-gray-400"></span>
          </div>
        </div>

        <!-- Info vaisseau fixe (mode édition) -->
        <div id="ship-info-section" class="hidden px-3 py-2 rounded text-sm" style="background:var(--bg2);border:1px solid var(--border)">
          <p id="ship-info-nom" class="font-medium"></p>
          <p id="ship-info-details" class="text-xs mt-0.5" style="color:var(--text-muted)"></p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="col-span-2">
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Camp</label>
            <input type="hidden" id="ship-camp" value="joueurs">
            <div id="ship-camp-buttons" class="flex gap-2">
              <button type="button" data-camp="joueurs"
                class="camp-btn flex-1 py-2 rounded text-sm font-medium border-2 transition-all"
                style="border-color:#4a9e58;color:#4a9e58">Joueurs</button>
              <button type="button" data-camp="ennemis"
                class="camp-btn flex-1 py-2 rounded text-sm font-medium border-2 transition-all"
                style="border-color:#c44040;color:#c44040">Ennemis</button>
              <button type="button" data-camp="neutres"
                class="camp-btn flex-1 py-2 rounded text-sm font-medium border-2 transition-all"
                style="border-color:#c8943a;color:#c8943a">Neutres</button>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Trajectoire</label>
            <input type="hidden" id="ship-trajectoire" value="attaque">
            <button type="button" id="ship-trajectoire-toggle"
              class="w-full py-2 rounded text-sm font-medium border-2 transition-all flex items-center justify-between px-3"
              style="border-color:var(--primary);color:var(--primary);background:transparent">
              <span id="traj-icon" class="text-base">&#x2194;</span>
              <span id="traj-label">Attaque</span>
              <span class="text-xs opacity-60" id="traj-hint">axe horizontal</span>
            </button>
          </div>
          <div>
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Position (K)</label>
            <input id="ship-position" type="number" step="25" min="-600" max="600"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500"
              placeholder="200">
          </div>
          <div>
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Structure actuelle</label>
            <input id="ship-structure-actuelle" type="number" min="0"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500"
              placeholder="100">
          </div>
          <div class="col-span-2">
            <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Avantage (valeur)</label>
            <input id="ship-avantage" type="number" min="1"
              class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500"
              placeholder="Laisser vide si aucun">
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input id="ship-contact-visuel" type="checkbox" class="rounded">
          <label for="ship-contact-visuel" class="text-sm text-gray-300">Contact visuel avec un ennemi</label>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button"
            class="px-4 py-2 text-sm text-gray-400 hover:text-gray-200"
            onclick="document.getElementById('ship-modal').classList.add('hidden')">Annuler</button>
          <button type="submit"
            class="px-4 py-2 text-sm rounded btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/combat-spatial-app.js"></script>
  <script type="module" src="/js/shared/nav-bar.js"></script>
</body>
</html>
