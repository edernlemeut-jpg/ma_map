<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chasses au Trésor (TdM) — Metal Adventures</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=2.0.0">
  <link rel="stylesheet" href="/css/ma-theme.css">
  <style>
    /* Section-toggle chevron */
    .section-chevron { transition: transform 0.2s; display: inline-block; }

    .btn-primary {
      background: #92400e;
      color: #fef3c7;
      font-weight: 500;
    }
    .btn-primary:hover { background: #b45309; }

    .mf-pool-bar-fill {
      transition: width 0.3s ease;
    }

    /* Scrollbar fine */
    #chasse-list::-webkit-scrollbar { width: 4px; }
    #chasse-list::-webkit-scrollbar-track { background: transparent; }
    #chasse-list::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }

    #right-panel::-webkit-scrollbar { width: 4px; }
    #right-panel::-webkit-scrollbar-track { background: transparent; }
    #right-panel::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }

    /* Bouton retour mobile (caché sur desktop) */
    .mobile-back { display: none; }

    /* ── Responsive mobile ───────────────────────────────── */
    @media (max-width: 767px) {
      main.flex { flex-direction: column !important; height: auto !important; overflow: visible !important; }

      #chasse-sidebar {
        width: 100% !important;
        border-right: none !important;
        border-bottom: 1px solid #374151;
        max-height: 45vh;
      }
      #right-panel { display: none !important; }

      body.detail-open #chasse-sidebar { display: none !important; }
      body.detail-open #right-panel { display: flex !important; flex-direction: column; min-height: 100dvh; overflow-y: auto; padding-bottom: 1rem; }

      .mobile-back { display: inline-flex !important; align-items: center; gap: 0.4rem; }

      /* Wizard steps scrollable */
      #wiz-step-content { overflow-y: auto; }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header commun -->
  <header class="border-b border-gray-700 bg-gray-800 flex-shrink-0">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/"><img src="/images/logo.png" alt="Metal Adventures" class="ma-logo-img"></a>
        <span style="color:var(--border)">|</span>
        <h1 class="font-bold flex items-center gap-2" style="color:var(--gold);font-family:'Rajdhani',sans-serif;font-weight:700;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg> Chasses au Trésor</h1>
        <span class="text-xs" style="color:var(--text-muted)">Supplément TdM</span>
      </div>
      <nav class="flex items-center gap-4 text-sm">
        <span id="header-table-info" class="hidden flex items-center gap-2 text-gray-300 border-r border-gray-600 pr-4 mr-2">
          <span id="header-table-name" class="font-medium"></span>
          <span id="header-table-role" class="text-xs"></span>
          <a href="#" id="header-change-table" class="text-blue-400 hover:text-blue-300 text-xs ml-1" title="Changer de table">✕</a>
        </span>
        <span id="auth-user-info" class="hidden flex items-center gap-3">
          <span id="auth-user-name" class="text-gray-300"></span>
          <a href="#" id="auth-logout-btn" class="text-red-400 hover:text-red-300 hover:underline">Déconnexion</a>
        </span>
        <a href="/login.html" id="auth-login-link" class="text-blue-400 hover:underline">Connexion</a>
      </nav>
    </div>
  </header>

  <!-- Contenu principal : layout 2 colonnes -->
  <main class="flex-1 flex overflow-hidden" style="height: calc(100vh - 57px);">

    <!-- Colonne gauche : liste des chasses -->
    <aside id="chasse-sidebar" class="w-72 flex-shrink-0 border-r border-gray-700 flex flex-col bg-gray-850">
      <div class="p-4 border-b border-gray-700 flex items-center justify-between">
        <h2 class="font-semibold text-sm text-gray-200">Mes chasses</h2>
        <button id="btn-new-chasse" class="text-xs px-3 py-1.5 rounded btn-primary">+ Nouvelle</button>
      </div>
      <div id="chasse-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        <p class="text-gray-500 text-sm text-center py-8">Chargement…</p>
      </div>
    </aside>

    <!-- Colonne droite : détail / panneau vide -->
    <section id="right-panel" class="flex-1 overflow-y-auto p-6">
      <div class="flex flex-col items-center justify-center h-full text-gray-500 gap-4 py-20">
        <span class="text-5xl">🗺️</span>
        <p class="text-center">Sélectionnez une chasse dans la liste<br>ou créez-en une nouvelle.</p>
      </div>
    </section>

  </main>

  <!-- Toast erreurs -->
  <div id="toast" class="hidden"></div>

  <script type="module" src="/js/tresors-app.js"></script>
  <script type="module" src="/js/shared/nav-bar.js"></script>
</body>
</html>
