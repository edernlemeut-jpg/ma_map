<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Adventures — Compendium</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=2.0.0">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-gray-700 bg-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold">
        <a href="/" class="hover:text-blue-400 transition-colors">⚙️ Metal Adventures</a>
      </h1>
      <nav class="flex items-center gap-4 text-sm">
        <!-- Table context (hidden until loaded) -->
        <span id="header-table-info" class="hidden flex items-center gap-2 text-gray-300 border-r border-gray-600 pr-4 mr-2">
          <span id="header-table-name" class="font-medium"></span>
          <span id="header-table-role" class="text-xs"></span>
          <a href="#" id="header-change-table"
             class="text-blue-400 hover:text-blue-300 text-xs ml-1" title="Changer de table">✕</a>
        </span>
        <span id="auth-user-info" class="hidden flex items-center gap-3">
          <span id="auth-user-name" class="text-gray-300"></span>
          <a href="#" id="auth-logout-btn"
             class="text-red-400 hover:text-red-300 hover:underline">Déconnexion</a>
        </span>
        <a href="/login.html" id="auth-login-link" class="text-blue-400 hover:underline">Connexion</a>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6">
    <!-- Loading state -->
    <div id="loading" class="text-center py-12 text-gray-400">Chargement du compendium…</div>

    <!-- Search bar -->
    <div id="search-bar" class="hidden mb-4 relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">🔍</span>
      <input id="search-input" type="text"
             class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-10 py-3 min-h-[44px] text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors"
             placeholder="Rechercher…" autocomplete="off">
      <button id="search-clear" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 min-w-[44px] min-h-[44px] flex items-center justify-center" title="Effacer">✕</button>
    </div>

    <!-- Tab navigation -->
    <nav id="tab-nav" class="hidden flex border-b border-gray-700 mb-6 gap-1">
      <button data-tab="systems"
              class="tab-btn px-4 py-3 text-sm font-medium rounded-t-lg min-h-[44px] min-w-[44px] relative transition-colors">
        Systèmes
        <span data-badge="systems" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full"></span>
      </button>
      <button data-tab="factions"
              class="tab-btn px-4 py-3 text-sm font-medium rounded-t-lg min-h-[44px] min-w-[44px] relative transition-colors">
        Factions
        <span data-badge="factions" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full"></span>
      </button>
      <button data-tab="ship_models"
              class="tab-btn px-4 py-3 text-sm font-medium rounded-t-lg min-h-[44px] min-w-[44px] relative transition-colors">
        Vaisseaux
        <span data-badge="ship_models" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full"></span>
      </button>
    </nav>

    <!-- Tab content panels -->
    <div id="tab-systems" class="tab-panel hidden"></div>
    <div id="tab-factions" class="tab-panel hidden"></div>
    <div id="tab-ship_models" class="tab-panel hidden"></div>

    <!-- Search results -->
    <div id="search-results" class="hidden"></div>

    <!-- Global empty state -->
    <div id="empty-global" class="hidden text-center py-16 px-4">
      <p class="text-2xl mb-4">🔒</p>
      <p class="text-lg text-gray-300 italic max-w-md mx-auto">Les archives du vaisseau sont encore verrouillées. Votre équipage n'a pas assez d'accréditations pour accéder aux données galactiques…</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden text-center py-12">
      <p class="text-red-400">Erreur de chargement. <button id="retry-btn" class="text-blue-400 hover:underline">Réessayer</button></p>
    </div>
  </main>

  <script type="module" src="/js/shared/cold-start.js?v=2.0.0"></script>
  <script type="module" src="/js/compendium/compendium-app.js?v=2.0.0"></script>
</body>
</html>
